<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130E0A">
<title>Heldenbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel+Decorative:wght@700&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@600;700&family=Fredoka:wght@600&family=Pirata+One&family=Marcellus+SC&family=Almendra:wght@700&display=swap">
<style>
/* Layout: Kerzenlicht-Archiv – eine dunkle, warme Bühne; oben schlichte Navigation, darunter Heldenkarten, Builder-Kapitel und Spielbogen als leuchtende Tafeln. Bewusst nur ein (dunkles) Erscheinungsbild. */
:root{
  color-scheme:dark;
  --bg:#130E0A; --bg2:#1A130E; --surface:#211812; --raised:#2B2018; --sunk:#0F0B08;
  --ink:#F1E6D0; --muted:#B9A587; --faint:#8A7863; --line:rgba(var(--line-rgb),.16); --line2:rgba(var(--line-rgb),.32);
  --gold:#E2AE52; --gold-hi:#F6D58E; --gold-ink:#1B1209; --ember:#E0763A; --wine:#B9474A; --moss:#86B07A; --arcane:#B28DE0;
  --glow:0 0 0 1px var(--line2), 0 0 24px rgba(var(--gold-rgb),.12);
  --gold-rgb:226,174,82; --gold-hi-rgb:246,213,142; --wine-rgb:185,71,74; --arcane-rgb:178,141,224; --ember-rgb:224,118,58; --bg-rgb:19,14,10; --line-rgb:222,176,104; --deep-rgb:10,6,4;
  --card-a:#2E2219; --card-b:#1C1510; --gold-lo:#8a5d1e; --glow1-rgb:224,118,58; --glow2-rgb:178,141,224; --glow3-rgb:226,174,82;
  --f-display:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif; --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(1200px 700px at 15% -10%,rgba(var(--glow1-rgb),.12),transparent 60%),radial-gradient(900px 600px at 100% 10%,rgba(var(--glow2-rgb),.06),transparent 60%),radial-gradient(1000px 800px at 50% 120%,rgba(var(--glow3-rgb),.07),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#scene::before,#scene::after{content:"";position:absolute;inset:0}
#scene::before{inset:-4%;background:radial-gradient(1400px 760px at 14% 8%,rgba(var(--glow1-rgb),.26),transparent 56%),radial-gradient(1000px 620px at 100% 0%,rgba(var(--glow2-rgb),.18),transparent 58%),linear-gradient(180deg,rgba(var(--deep-rgb),.16) 0%,rgba(var(--deep-rgb),.36) 32%,rgba(var(--deep-rgb),.68) 100%),var(--scene-image) var(--scene-pos,center center)/cover no-repeat;opacity:var(--scene-opacity,.42);filter:saturate(1.08) contrast(1.05) brightness(.88);transform:scale(1.035);transform-origin:center center;animation:hbSceneDrift 38s ease-in-out infinite}
#scene::after{background:radial-gradient(ellipse at 50% 0%,transparent 28%,rgba(var(--deep-rgb),.14) 62%,rgba(var(--deep-rgb),.58) 100%),linear-gradient(180deg,rgba(var(--bg-rgb),.06),rgba(var(--bg-rgb),.28) 44%,rgba(var(--bg-rgb),.74));mix-blend-mode:normal}
html[data-fx="dezent"] #scene::before{animation-duration:54s;filter:saturate(1.04) contrast(1.02) brightness(.86)}
html[data-fx="aus"] #scene::before{animation:none}
@keyframes hbSceneDrift{0%{transform:scale(1.035) translate3d(0,0,0)}25%{transform:scale(1.055) translate3d(0,-.55%,0)}50%{transform:scale(1.045) translate3d(-.4%,.15%,0)}75%{transform:scale(1.06) translate3d(.45%,-.2%,0)}100%{transform:scale(1.035) translate3d(0,0,0)}}

#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#top,#view,.foot,#toast,#modal{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(var(--gold-rgb),.35)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.03em;color:var(--gold-hi)}
h1{font-size:2rem;line-height:1.15} h2{font-size:1.22rem;margin-block:4px 12px} h3{font-size:1.02rem;margin-block:20px 9px;color:var(--gold)} h4{font-size:.86rem;margin-block:14px 7px;color:var(--muted);letter-spacing:.08em}
h2 small,h3 small,h4 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Kopf */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(var(--bg-rgb),.86);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px 18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:10px;color:var(--gold-hi);border:0;background:none;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.tabs button{border:1px solid transparent;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--gold-ink);background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 0 18px rgba(var(--gold-rgb),.35)}
.curhero{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;max-width:240px;min-width:0}
.curhero .sigil{width:30px;height:30px;font-size:.78rem}
.curhero span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.savest{display:block;text-align:right;font-size:.74rem;color:var(--faint);padding-bottom:6px}
/* Grundelemente */
select,input[type=number],input[type=text],input[type=search],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%;color:var(--ink)}
select option,select optgroup{background:var(--surface);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select:focus,input:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(var(--gold-rgb),.18)}
textarea{resize:vertical;line-height:1.45}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-radius:10px;padding:9px 18px;font-weight:700;white-space:nowrap;letter-spacing:.02em;box-shadow:0 2px 14px rgba(var(--gold-rgb),.18)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:none;border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--gold);background:rgba(var(--gold-rgb),.06)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn.big{padding:13px 24px;font-size:1.05rem}
.btn.danger{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:none}
.btn.dmg{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:none}
.btn.heal{background:var(--moss);border-color:var(--moss);color:#14200F;box-shadow:none}
.link{border:0;background:none;color:var(--gold);text-decoration:underline;text-underline-offset:3px;padding:0;font-weight:500}
#view{padding-block:22px 60px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:var(--gold-ink);font-weight:700;box-shadow:0 0 14px rgba(var(--gold-rgb),.28)}
.chip:disabled{opacity:.35;cursor:default}
.chip i,.spell summary i{font-style:normal;font-size:.68rem;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-left:4px;opacity:.75}
.tag{background:rgba(var(--arcane-rgb),.14);border:1px solid rgba(var(--arcane-rgb),.3);color:#E3D3F7;border-radius:999px;padding:4px 12px;font-size:.88rem}
.hint{color:var(--muted);font-size:.94rem;margin:6px 0 12px;max-width:72ch}
.empty{color:var(--muted);font-style:italic}
.calc{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:.93rem}
.calc b{color:var(--gold-hi);font-family:var(--f-display)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-block:12px;background:var(--bg2)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-block:9px}
.row>.fld{flex:1 1 180px}
.row.misc>.fld{flex:1 1 115px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.fld em{font-size:.8rem;color:var(--faint);font-style:normal}
/* Heldenauswahl */
.hero-intro{display:grid;gap:6px;margin-bottom:22px;text-align:center;justify-items:center}
.hero-intro h1{font-size:clamp(1.8rem,4vw,2.6rem);text-shadow:0 0 30px rgba(var(--gold-rgb),.3)}
.hero-intro p{color:var(--muted);margin:0;max-width:56ch}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.hero{position:relative;background:linear-gradient(180deg,rgba(var(--deep-rgb),.07),rgba(var(--deep-rgb),0)),linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;display:grid;gap:12px;justify-items:center;text-align:center;transition:border-color .2s,box-shadow .2s,transform .2s;box-shadow:0 18px 44px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04)}
.hero:hover{border-color:var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 30px rgba(var(--gold-rgb),.08);transform:translateY(-2px)}
.hero.cur{border-color:var(--gold);box-shadow:var(--glow)}
.hero .curlbl{position:absolute;top:10px;right:12px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hero h3{margin:0;font-size:1.12rem;color:var(--ink)}
.hero p{margin:0;color:var(--muted);font-size:.9rem}
.hero .mini{display:flex;gap:14px;font-size:.85rem;color:var(--muted)}
.hero .mini b{color:var(--gold-hi);font-family:var(--f-display);font-size:1.05rem;margin-right:3px}
.hero .warnline{color:#F0A27A;font-size:.82rem;margin:0}
.hero .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hero .acts2{display:flex;gap:2px 12px;flex-wrap:wrap;justify-content:center;font-size:.86rem}
.hero .acts2 button{border:0;background:none;color:var(--muted);padding:2px 0;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.hero .acts2 button:hover{color:var(--ink)}
.hero .acts2 .del{color:var(--wine)}
.sigil{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.7rem;color:var(--gold-hi);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--h) 55%,var(--raised)),var(--bg) 75%);box-shadow:0 0 0 2px var(--h),0 0 0 6px rgba(0,0,0,.35),0 0 0 7px color-mix(in srgb,var(--h) 45%,transparent),0 0 30px color-mix(in srgb,var(--h) 35%,transparent);letter-spacing:.04em;flex:none}
.newhero{border:1.5px dashed var(--line2);border-radius:18px;background:rgba(var(--gold-rgb),.03);display:grid;place-items:center;align-content:center;gap:10px;padding:24px;min-height:250px;text-align:center;color:var(--muted)}
.newhero .plus{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-size:2rem;color:var(--gold);font-family:var(--f-display);box-shadow:0 0 24px rgba(var(--gold-rgb),.2)}
.newhero b{font-family:var(--f-display);color:var(--gold-hi);font-size:1.05rem;letter-spacing:.04em}
.herobar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.filebtn{cursor:pointer;display:inline-flex;align-items:center}.filebtn input{display:none}
/* Builder */
.build{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:20px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;position:sticky;top:96px}
.steps button{width:100%;text-align:left;border:1px solid transparent;background:none;padding:9px 11px;border-radius:12px;display:flex;gap:11px;align-items:center;font-weight:500;color:var(--muted)}
.steps button:hover{color:var(--ink)}
.steps button span{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.82rem;flex:none;font-family:var(--f-display);color:var(--gold)}
.steps button.on{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:700}
.steps button.on span{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:var(--gold-ink);box-shadow:0 0 14px rgba(var(--gold-rgb),.4)}
.panel{background:linear-gradient(180deg,rgba(var(--deep-rgb),.08),rgba(var(--deep-rgb),0)),linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:22px 24px;min-width:0;box-shadow:0 22px 60px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04)}
.panel>h2:first-child{font-size:1.45rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.card{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);padding:11px 13px;text-align:left;display:grid;gap:3px;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2)}
.card b{font-family:var(--f-display);font-size:1rem;color:var(--ink);font-weight:600}
.card small{color:var(--muted);font-size:.8rem}
.card .sub{font-style:italic;color:var(--faint)}
.card.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(var(--gold-rgb),.16),rgba(var(--gold-rgb),.04));box-shadow:var(--glow)}
.card.on b{color:var(--gold-hi)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.opt{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);padding:11px 13px;text-align:left;display:grid;gap:4px}
.opt:hover{border-color:var(--line2)}
.opt span{font-size:.87rem;color:var(--muted)}
.opt.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(var(--gold-rgb),.14),rgba(var(--gold-rgb),.03));box-shadow:var(--glow)}
.opt.on b{color:var(--gold-hi)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--sunk);width:max-content}
.stepper button{border:0;background:var(--raised);width:38px;height:38px;font-size:1.2rem;font-weight:700;color:var(--gold)}
.stepper button:hover{background:#3a2b1f}
.stepper b{min-width:50px;text-align:center;font-size:1.2rem;font-family:var(--f-display);color:var(--gold-hi)}
.stepper.sm button{width:30px;height:30px;font-size:1rem}.stepper.sm b{min-width:58px;font-size:.95rem}
.rolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);width:55%}
td{font-family:var(--f-display);color:var(--gold-hi)}
.bgplus,.asiplus{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-block:9px}
.bp{display:grid;gap:5px}.bp>span{font-size:.86rem;font-weight:700}
.abgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-block:12px}
.abbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:7px;background:var(--bg2)}
.abbox.prim{border-color:rgba(var(--gold-rgb),.55);box-shadow:0 0 18px rgba(var(--gold-rgb),.08)}
.abn{font-family:var(--f-display);font-weight:600;color:var(--ink)}
.abres{display:flex;align-items:baseline;gap:8px}.abres b{font-size:1.7rem;font-family:var(--f-display);color:var(--gold-hi)}.abres span{color:var(--gold);font-weight:700}
.abbox small{color:var(--faint);font-size:.78rem;min-height:1em}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 16px;margin-block:12px}
.sk{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--line);color:var(--faint)}
.sk.p1,.sk.p2{color:var(--ink);font-weight:500}.sk.p2 b{color:var(--gold-hi)}
.sk small{font-size:.72rem}
.stats3{display:flex;gap:10px;flex-wrap:wrap}
.stats3>div{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:9px 16px;display:grid}
.stats3 span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stats3 b{font-size:1.5rem;font-family:var(--f-display);color:var(--gold-hi)}
.cnt{font-family:var(--f-body);font-size:.85rem;color:var(--gold);font-weight:700;margin-left:6px}
.wlist{display:grid;gap:9px}
.wrow{display:flex;flex-wrap:wrap;align-items:end;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--bg2)}
.wrow .wn{flex:1 1 160px;display:grid}.wrow .wn small{color:var(--muted)}
.wrow .wv{font-family:var(--f-display);color:var(--gold-hi);flex:0 0 auto;align-self:center}
.wrow .fld{width:115px}
.x{border:0;background:none;font-size:1.5rem;color:var(--muted);line-height:1;padding:4px 6px}
.x:hover{color:var(--wine)}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.plain{padding-left:18px}
.mch{margin-top:28px}.mch small{margin-left:8px}
.mcbox{display:grid;gap:10px}.mcrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mcrow>b{font-family:var(--f-display);font-size:1.05rem;color:var(--gold-hi)}.mcrow .x{margin-left:auto}
.clsh{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;font-size:1.15rem}
.finish{border:1px solid var(--gold);border-radius:16px;padding:18px;margin-block:18px;background:linear-gradient(180deg,rgba(var(--gold-rgb),.12),rgba(var(--gold-rgb),.02));display:grid;gap:10px;box-shadow:var(--glow)}
.finish h3{margin:0}
.finish .chips{gap:10px}
.summary{position:sticky;top:96px;background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:4px}
.summary .shd{display:flex;gap:12px;align-items:center}
.summary .sigil{width:52px;height:52px;font-size:1.05rem}
.summary h3{margin:0;color:var(--ink)}.summary .sub{color:var(--muted);font-size:.86rem;margin:2px 0 10px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sgrid>div{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:7px 6px;display:grid;text-align:center}
.sgrid span{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sgrid b{font-size:1.15rem;font-family:var(--f-display);color:var(--gold-hi)}
.abmini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;text-align:center}
.abmini span{display:block;font-size:.64rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.abmini b{display:block;font-family:var(--f-display);color:var(--ink)}
.abmini small{font-size:.75rem;color:var(--gold);font-weight:700}
.warn{padding-left:18px;margin:4px 0;font-size:.88rem;color:#F0A27A}
.warn li{margin-block:4px}
.warn button{border:0;background:none;color:inherit;text-align:left;padding:2px 0;font:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.warn button:hover{text-decoration-style:solid;color:#FFC29E}
.ok{color:var(--moss);font-weight:700}
.feats{display:grid;gap:2px}
.feats details{border-bottom:1px solid var(--line);padding:7px 0}
.feats summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}
.feats summary::-webkit-details-marker{display:none}
.feats summary b{font-weight:500}
.feats summary b::before{content:"✦";color:var(--gold);font-size:.7rem;margin-right:8px;opacity:.7}
.feats details[open] summary b{color:var(--gold-hi)}
.feats summary small{color:var(--faint);font-size:.8rem;text-align:right}
.feats p{margin:6px 0 4px 20px;font-size:.94rem;max-width:68ch;color:var(--muted)}
/* Bogen */
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}
.shead .who{display:flex;gap:16px;align-items:center;min-width:0}
.shead .sigil{width:72px;height:72px;font-size:1.45rem}
.shead p{margin:4px 0 0;color:var(--muted)}
.sctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:7px 13px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink)}
.notice{background:rgba(var(--ember-rgb),.08);border:1px solid rgba(var(--ember-rgb),.35);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:.93rem}
.notice .warn{margin:6px 0 0}
.vitals{display:grid;grid-template-columns:120px minmax(290px,2fr) repeat(5,minmax(92px,1fr));gap:9px}
.vt{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;align-content:start;gap:3px;text-align:left;color:var(--ink)}
.vt span{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.vt b{font-size:1.6rem;font-family:var(--f-display);color:var(--gold-hi);line-height:1.15;font-weight:600}
.vt b small{font-size:.8rem;color:var(--muted);font-family:var(--f-body)}
.vt.roll:hover,.abm:hover,.sv:hover,.skills button:hover,.rb:hover{border-color:var(--gold);box-shadow:0 0 16px rgba(var(--gold-rgb),.18)}
.vt.ac{text-align:center;justify-items:center;border-color:var(--line2);border-radius:14px 14px 50px 50px;padding-bottom:16px;background:radial-gradient(circle at 50% 30%,rgba(var(--gold-rgb),.16),transparent 70%),var(--surface)}
.vt.ac b{font-size:2.4rem}
.hpline{display:flex;align-items:baseline;gap:6px}.hpline b{font-size:2.1rem}.hpline small{color:var(--muted)}
.hpbar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:4px 0 8px;border:1px solid var(--line)}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--ember),var(--gold));transition:width .35s}
.hpctl{display:flex;gap:6px;flex-wrap:wrap}.hpctl input{width:80px;flex:none}
.death{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(var(--wine-rgb),.1);border:1px solid var(--wine);border-radius:14px;padding:10px 14px;margin-top:9px}
.srow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-block:14px}
.exh{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}.exh select{width:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.blk{background:linear-gradient(180deg,rgba(var(--deep-rgb),.07),rgba(var(--deep-rgb),0)),linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0;box-shadow:0 18px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04)}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ab{display:grid;gap:5px}
.abm{border:1px solid var(--line);background:radial-gradient(circle at 50% 20%,rgba(var(--gold-rgb),.1),transparent 70%),var(--sunk);border-radius:14px;padding:9px 4px 10px;display:grid;justify-items:center;gap:1px;color:var(--ink)}
.abm span{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.abm b{font-family:var(--f-display);font-size:1.75rem;line-height:1.15;color:var(--gold-hi);font-weight:600}
.abm small{border:1px solid var(--line2);border-radius:999px;padding:0 10px;font-size:.82rem;background:var(--surface)}
.sv{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 6px;font-size:.84rem;color:var(--faint)}
.sv.p{color:var(--ink);font-weight:700;border-color:rgba(var(--gold-rgb),.55)}
.skills{list-style:none;margin:0;padding:0}
.skills button{width:100%;border:0;border-bottom:1px dotted var(--line);background:none;display:flex;gap:9px;align-items:center;padding:6px 4px;text-align:left;border-radius:6px}
.skills button:hover{box-shadow:none;background:rgba(var(--gold-rgb),.06)}
.skills span{flex:1}.skills small{color:var(--faint);font-size:.72rem}
.skills b{font-family:var(--f-display);color:var(--gold-hi);font-weight:600}
.pp{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.pp.p1{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(var(--gold-rgb),.6)}
.pp.p2{background:var(--gold-hi);border-color:var(--gold-hi);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold),0 0 8px rgba(var(--gold-rgb),.7)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:.93rem}.dl dt{color:var(--muted)}.dl dd{margin:0}
.atks{display:grid;gap:4px}
.atk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px}
.atk .an{flex:1 1 180px;display:grid;min-width:0}.atk .an small{color:var(--muted);font-size:.8rem}
.atk abbr{text-decoration:underline dotted;cursor:help}
.rb{border:1px solid var(--line2);background:var(--sunk);border-radius:10px;padding:6px 12px;font-family:var(--f-display);font-weight:600;color:var(--gold-hi);min-width:56px}
.rb small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.75rem}
.slots{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:12px}
.sl{display:grid;gap:4px}.sl span{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle at 40% 35%,var(--gold-hi),var(--gold) 60%,var(--gold-lo));padding:0;box-shadow:0 0 10px rgba(var(--gold-rgb),.45)}
.pip.used{background:transparent;border-color:var(--line2);box-shadow:none}
.res{display:grid;gap:9px}
.rs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:9px}
.rs>div:first-child{display:grid}.rs small{color:var(--muted);font-size:.8rem}
.pool{display:flex;gap:6px}.pool input{width:84px}
.splist{display:grid;gap:5px}
/* Lange Listen: nur sichtbare Einträge werden gezeichnet; Platzhalterhöhe = typische Höhe eines geschlossenen Eintrags */
.cvl>details{content-visibility:auto;contain-intrinsic-size:auto 64px}.mobs.cvl>details{contain-intrinsic-size:auto 66px}
@media (min-width:700px){.cvl>details{contain-intrinsic-size:auto 41px}.mobs.cvl>details{contain-intrinsic-size:auto 50px}}
.splist h4{margin-top:12px}
.spell{border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.spell[open]{border-color:var(--line2)}
.spell summary{cursor:pointer;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;list-style:none}
.spell summary::-webkit-details-marker{display:none}
.spell summary b{font-weight:500}
.spell summary small{margin-left:auto;color:var(--faint);font-size:.8rem}
.spell summary em{font-style:normal;font-size:.74rem;background:rgba(var(--arcane-rgb),.14);color:#E3D3F7;border-radius:999px;padding:0 9px}
.castbtns{display:flex;gap:6px;align-items:center;margin-left:8px}
.btn.cast{padding:4px 12px}
.mat{font-size:.88rem;color:var(--muted);border-left:2px solid var(--line2);padding-left:10px}
.mat b{color:var(--ink);font-weight:600}.mat small{color:var(--faint)}
.mat.cost{border-left-color:var(--gold)}.mat.cost b{color:var(--gold-hi)}
.mat .used{font-size:.74rem;font-weight:700;background:rgba(var(--wine-rgb),.2);color:#F3B0A0;border:1px solid rgba(var(--wine-rgb),.5);border-radius:999px;padding:0 8px;margin-left:4px}
.spell summary i.gm{color:var(--gold);border-color:var(--gold)}
.noslot{font-size:.78rem;color:var(--faint);font-style:italic}
.spell.concon{border-color:var(--arcane);box-shadow:0 0 18px rgba(var(--arcane-rgb),.18)}
.spell summary em.cc{background:var(--arcane);color:#1a1024;font-weight:700}
.upc{align-items:center;margin-bottom:8px}.upc>span{font-size:.82rem;color:var(--muted)}
.concchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--arcane);background:rgba(var(--arcane-rgb),.12);color:#E3D3F7;border-radius:999px;padding:3px 4px 3px 12px;font-size:.9rem}
.concchip .x{font-size:1.1rem;color:#E3D3F7;padding:0 6px}
.sbody{padding:0 12px 12px}.sbody p{margin:4px 0 9px;max-width:70ch}.sbody .meta{font-size:.82rem;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:240px;overflow:auto}
.log li{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:5px 0;border-bottom:1px solid var(--line)}
.log li small{grid-column:1/-1;color:var(--faint);font-size:.78rem}
.log b{font-family:var(--f-display);color:var(--gold-hi)}.log b.crit{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.logblk{margin-top:16px}
.logs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tlog li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0}
.tlog li .sigil{width:34px;height:34px;font-size:.78rem}
.tlog li>div{display:grid;min-width:0}.tlog li>div small{grid-column:auto}
.tlog li .who{font-family:var(--f-display);color:var(--ink);font-weight:600}
.tlog li.me .who{color:var(--gold-hi)}
.tlog .tot{font-family:var(--f-display);font-size:1.35rem;color:var(--gold-hi)}.tlog .tot.crit{color:var(--gold);text-shadow:0 0 12px var(--gold)}.tlog .tot.fum{color:var(--wine)}
.tlog.big{max-height:70vh}
.tlog.open{max-height:none}
.lf{margin-bottom:8px}
.link.more{margin-top:8px;display:inline-block}
.fight{margin-bottom:16px;border-color:var(--line2)}
.fhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.fhead h2{margin:0 0 4px}
.order{list-style:none;margin:14px 0 6px;padding:0;display:grid;gap:6px}
.order li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:7px 12px}
.order li.now{border-color:var(--gold);background:linear-gradient(90deg,rgba(var(--gold-rgb),.2),rgba(var(--gold-rgb),.03));box-shadow:var(--glow)}
.order li.me .on{color:var(--gold-hi)}
.order .iv{font-family:var(--f-display);font-size:1.4rem;color:var(--gold-hi);min-width:34px;text-align:center}
.order .sigil{width:36px;height:36px;font-size:.8rem}
.sigil.npc{--h:#8a3b3b;font-size:1rem}
.order .on{flex:1;font-weight:500;min-width:0}.order .on small{color:var(--muted);font-weight:400}
.tag.now{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.fctl{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fgrp{display:grid;gap:6px}.fgrp>b{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fgrp .chips{align-items:center}.fgrp input{width:110px}.fgrp input[type=text]{width:150px}
.btn:disabled{opacity:.4;cursor:default}
#turnbar:empty{display:none}
.tb{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:7px;border-top:1px solid var(--line);font-size:.93rem}
.tbr{font-family:var(--f-display);color:var(--gold);letter-spacing:.06em}
.tbsp{flex:1}
@media (max-width:600px){.tb{flex-wrap:nowrap;gap:8px;padding-block:5px;font-size:.86rem}.tb .tbr{font-size:.74rem;white-space:nowrap}.tb>span:nth-child(2){flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb .tbsp{display:none}.tb .btn{flex:none}.tb .tbme{white-space:nowrap;font-size:.95rem}.tb>.link{display:none}.tb .tbaway{display:none}}
.tb.mine{background:linear-gradient(90deg,rgba(var(--gold-rgb),.22),rgba(var(--ember-rgb),.12) 60%,transparent)}
.tbme{font-family:var(--f-display);color:var(--gold-hi);font-size:1.05rem;text-shadow:0 0 14px rgba(var(--gold-rgb),.6)}
.glowbtn{animation:glowpulse 1.6s ease-in-out infinite}
@keyframes glowpulse{0%,100%{box-shadow:0 0 10px rgba(var(--gold-rgb),.35)}50%{box-shadow:0 0 26px rgba(var(--gold-hi-rgb),.85)}}
body.myturn::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;box-shadow:inset 0 0 0 3px rgba(var(--gold-rgb),.85),inset 0 0 60px rgba(var(--gold-rgb),.35);animation:edge 2s ease-in-out infinite}
@keyframes edge{0%,100%{opacity:.6}50%{opacity:1}}
.sheet.fallen{filter:grayscale(.85) brightness(.55);pointer-events:none;user-select:none;opacity:.6}
.fallencard{display:grid;place-items:center;margin-bottom:20px}
.stone{max-width:520px;width:100%;text-align:center;display:grid;justify-items:center;gap:8px;padding:30px 24px 24px;border-radius:160px 160px 18px 18px;border:1px solid rgba(var(--wine-rgb),.5);background:radial-gradient(circle at 50% 0%,rgba(var(--wine-rgb),.18),transparent 60%),linear-gradient(180deg,#2a1d18,#160f0c);box-shadow:0 0 50px rgba(var(--wine-rgb),.18),0 30px 60px rgba(0,0,0,.5)}
.stone .sigil{filter:grayscale(.7);width:76px;height:76px}
.stone h1{color:var(--ink)}.stone .ep{color:var(--muted);margin:0}
.stone .rip{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.3em;text-transform:uppercase;color:#E58A7A;margin:6px 0;text-shadow:0 0 20px rgba(var(--wine-rgb),.6)}
.stone p{max-width:44ch;margin:0}
.wait{color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--wine);animation:edge 1.4s ease-in-out infinite}
.dmonly{margin-top:4px;color:var(--muted);font-size:.9rem}.dmonly summary{cursor:pointer;text-decoration:underline dotted}
.pmdead{margin-top:8px;border-top:1px solid rgba(var(--wine-rgb),.4);padding-top:8px;display:grid;gap:6px}.pmdead b{color:#E58A7A;font-weight:600}
.pmc.dm span{border-color:var(--gold);color:var(--gold-hi)}
.dmbox{margin-top:4px;font-size:.9rem;color:var(--muted)}.dmlbl{color:var(--ink)}
.dlg.mercy{justify-items:center;text-align:center;border-color:rgba(var(--wine-rgb),.6);box-shadow:0 0 60px rgba(var(--wine-rgb),.25),0 30px 80px rgba(0,0,0,.6)}
.dlg.mercy h2{font-size:1.8rem;letter-spacing:.06em}.dlg.mercy .chips{justify-content:center}
.mt.big{padding:12px 18px;border-color:var(--gold)}.mt.big b{font-size:1.2rem}
.party{display:grid;gap:10px}
.pm{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg2)}
.pm.me{border-color:var(--line2)}
.pm .sigil{width:46px;height:46px;font-size:.95rem}
.pmb{flex:1;display:grid;gap:2px;min-width:0}.pmb>small{color:var(--muted)}
.pmhp{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:4px}
.pm .hpbar{margin:3px 0 0}
.pmc{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.pmc span{font-size:.74rem;border:1px solid rgba(var(--wine-rgb),.5);color:#F3B0A0;border-radius:999px;padding:0 8px}
.cstat{margin:6px 0 0;font-size:.9rem}.cstat.ok{color:var(--moss)}.cstat.bad{color:#F0A27A;max-width:60ch}
.campjoin{max-width:720px;margin:0 auto}
.steps2{padding-left:20px;color:var(--muted)}.steps2 li{margin-block:6px}.steps2 b{color:var(--ink)}
#mini{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:29;display:grid;gap:8px;pointer-events:none}
.mt{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--line2);border-radius:14px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .25s ease-out;transition:opacity .4s,transform .4s;max-width:calc(100vw - 32px)}
.mt.out{opacity:0;transform:translateX(-12px)}
.mt .sigil{width:36px;height:36px;font-size:.8rem}
.mt div{display:grid}.mt small{color:var(--muted);font-size:.8rem}.mt b{font-family:var(--f-display);font-size:1.4rem;color:var(--gold-hi);line-height:1.1}.mt b.crit{color:var(--gold)}.mt b.fum{color:var(--wine)}
.conds{margin-bottom:16px}
.conds .chips{align-items:center}
.conds .chip.on{background:linear-gradient(180deg,#E58A62,var(--wine));border-color:var(--wine);color:#fff;box-shadow:0 0 14px rgba(var(--wine-rgb),.4)}
.condlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px;margin-top:12px}
.cd{border:1px solid rgba(var(--wine-rgb),.45);background:rgba(var(--wine-rgb),.08);border-radius:12px;padding:10px 12px}
.cd b{font-family:var(--f-display);color:#F3B0A0}.cd p{margin:4px 0;font-size:.9rem;color:var(--muted)}.cd small{color:#F0A27A;font-size:.8rem}
/* Würfel-Toast */
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--card-a),var(--card-b));color:var(--ink);border:1px solid var(--line2);border-radius:18px;padding:14px 20px;min-width:220px;max-width:min(380px,calc(100vw - 32px));z-index:30;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 40px rgba(var(--gold-rgb),.15)}
#toast .tl{font-size:.86rem;color:var(--muted)}
#toast .tv{font-family:var(--f-display);font-size:2.5rem;line-height:1;color:var(--gold-hi);font-weight:700}
#toast .tv.crit{color:var(--gold);text-shadow:0 0 18px var(--gold)}#toast .tv.fum{color:var(--wine)}
#toast .tv.dim{opacity:.4}
#toast .td{font-size:.8rem;color:var(--faint);overflow-wrap:anywhere}
#toast .mode{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:1px 8px;margin-left:4px}
#toast.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:.4}to{transform:none;opacity:1}}
.die.rolling-x svg{filter:drop-shadow(0 0 8px rgba(var(--gold-rgb),.35))}
#tray{position:fixed;inset:0;z-index:28;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(var(--deep-rgb),.82),rgba(var(--deep-rgb),.55) 75%);transition:opacity .6s}
#tray.fade{opacity:0}
.tdie{position:absolute}
.tdie .die{width:100%;height:100%}
.tdie.fly{animation:fly .85s cubic-bezier(.2,.8,.3,1) both}
@keyframes fly{0%{transform:translate(var(--fx),var(--fy)) rotate(var(--rot)) scale(.5);opacity:0}15%{opacity:1}70%{transform:translate(0,0) rotate(calc(var(--fr) - 20deg)) scale(1.08)}85%{transform:translate(0,-4px) rotate(calc(var(--fr) + 6deg)) scale(.97)}100%{transform:rotate(var(--fr)) scale(1)}}
.tdie .die.pair .df{fill:var(--arcane);stroke:#F1E4FF}.tdie .die.pair text{fill:#1a1024}.tdie .die.pair svg{filter:drop-shadow(0 0 14px rgba(var(--arcane-rgb),.9))}
