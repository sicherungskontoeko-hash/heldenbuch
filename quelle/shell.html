<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130E0A">
<title>Heldenbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: Kerzenlicht-Archiv – eine dunkle, warme Bühne; oben schlichte Navigation, darunter Heldenkarten, Builder-Kapitel und Spielbogen als leuchtende Tafeln. Bewusst nur ein (dunkles) Erscheinungsbild. */
:root{
  color-scheme:dark;
  --bg:#130E0A; --bg2:#1A130E; --surface:#211812; --raised:#2B2018; --sunk:#0F0B08;
  --ink:#F1E6D0; --muted:#B9A587; --faint:#8A7863; --line:rgba(222,176,104,.16); --line2:rgba(222,176,104,.32);
  --gold:#E2AE52; --gold-hi:#F6D58E; --gold-ink:#1B1209; --ember:#E0763A; --wine:#B9474A; --moss:#86B07A; --arcane:#B28DE0;
  --glow:0 0 0 1px var(--line2), 0 0 24px rgba(226,174,82,.12);
  --f-display:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif; --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(1200px 700px at 15% -10%,rgba(224,118,58,.14),transparent 60%),radial-gradient(900px 600px at 100% 10%,rgba(178,141,224,.07),transparent 60%),radial-gradient(1000px 800px at 50% 120%,rgba(226,174,82,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#top,#view,.foot,#toast,#modal{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(226,174,82,.35)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.03em;color:var(--gold-hi)}
h1{font-size:2rem;line-height:1.15} h2{font-size:1.22rem;margin-block:4px 12px} h3{font-size:1.02rem;margin-block:20px 9px;color:var(--gold)} h4{font-size:.86rem;margin-block:14px 7px;color:var(--muted);letter-spacing:.08em}
h2 small,h3 small,h4 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Kopf */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(19,14,10,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px 18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:10px;color:var(--gold-hi);border:0;background:none;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs button{border:1px solid transparent;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--gold-ink);background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 0 18px rgba(226,174,82,.35)}
.curhero{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;max-width:240px;min-width:0}
.curhero .sigil{width:30px;height:30px;font-size:.78rem}
.curhero span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.savest{display:block;text-align:right;font-size:.74rem;color:var(--faint);padding-bottom:6px}
/* Grundelemente */
select,input[type=number],input[type=text],input[type=search],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%;color:var(--ink)}
select option,select optgroup{background:var(--surface);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select:focus,input:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(226,174,82,.18)}
textarea{resize:vertical;line-height:1.45}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-radius:10px;padding:9px 18px;font-weight:700;white-space:nowrap;letter-spacing:.02em;box-shadow:0 2px 14px rgba(226,174,82,.18)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:none;border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--gold);background:rgba(226,174,82,.06)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn.big{padding:13px 24px;font-size:1.05rem}
.btn.danger{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:none}
.btn.dmg{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:none}
.btn.heal{background:var(--moss);border-color:var(--moss);color:#14200F;box-shadow:none}
.link{border:0;background:none;color:var(--gold);text-decoration:underline;text-underline-offset:3px;padding:0;font-weight:500}
#view{padding-block:22px 60px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:var(--gold-ink);font-weight:700;box-shadow:0 0 14px rgba(226,174,82,.28)}
.chip:disabled{opacity:.35;cursor:default}
.chip i,.spell summary i{font-style:normal;font-size:.68rem;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-left:4px;opacity:.75}
.tag{background:rgba(178,141,224,.14);border:1px solid rgba(178,141,224,.3);color:#E3D3F7;border-radius:999px;padding:4px 12px;font-size:.88rem}
.hint{color:var(--muted);font-size:.94rem;margin:6px 0 12px;max-width:72ch}
.empty{color:var(--muted);font-style:italic}
.calc{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:.93rem}
.calc b{color:var(--gold-hi);font-family:var(--f-display)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-block:12px;background:var(--bg2)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-block:9px}
.row>.fld{flex:1 1 180px}
.row.misc>.fld{flex:1 1 115px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.fld em{font-size:.8rem;color:var(--faint);font-style:normal}
/* Heldenauswahl */
.hero-intro{display:grid;gap:6px;margin-bottom:22px;text-align:center;justify-items:center}
.hero-intro h1{font-size:clamp(1.8rem,4vw,2.6rem);text-shadow:0 0 30px rgba(226,174,82,.3)}
.hero-intro p{color:var(--muted);margin:0;max-width:56ch}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.hero{position:relative;background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;display:grid;gap:12px;justify-items:center;text-align:center;transition:border-color .2s,box-shadow .2s,transform .2s}
.hero:hover{border-color:var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 30px rgba(226,174,82,.08);transform:translateY(-2px)}
.hero.cur{border-color:var(--gold);box-shadow:var(--glow)}
.hero .curlbl{position:absolute;top:10px;right:12px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hero h3{margin:0;font-size:1.12rem;color:var(--ink)}
.hero p{margin:0;color:var(--muted);font-size:.9rem}
.hero .mini{display:flex;gap:14px;font-size:.85rem;color:var(--muted)}
.hero .mini b{color:var(--gold-hi);font-family:var(--f-display);font-size:1.05rem;margin-right:3px}
.hero .warnline{color:#F0A27A;font-size:.82rem;margin:0}
.hero .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hero .acts2{display:flex;gap:2px 12px;flex-wrap:wrap;justify-content:center;font-size:.86rem}
.hero .acts2 button{border:0;background:none;color:var(--muted);padding:2px 0;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.hero .acts2 button:hover{color:var(--ink)}
.hero .acts2 .del{color:var(--wine)}
.sigil{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.7rem;color:var(--gold-hi);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--h) 55%,#2b2018),#140e0a 75%);box-shadow:0 0 0 2px var(--h),0 0 0 6px rgba(0,0,0,.35),0 0 0 7px color-mix(in srgb,var(--h) 45%,transparent),0 0 30px color-mix(in srgb,var(--h) 35%,transparent);letter-spacing:.04em;flex:none}
.newhero{border:1.5px dashed var(--line2);border-radius:18px;background:rgba(226,174,82,.03);display:grid;place-items:center;align-content:center;gap:10px;padding:24px;min-height:250px;text-align:center;color:var(--muted)}
.newhero .plus{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-size:2rem;color:var(--gold);font-family:var(--f-display);box-shadow:0 0 24px rgba(226,174,82,.2)}
.newhero b{font-family:var(--f-display);color:var(--gold-hi);font-size:1.05rem;letter-spacing:.04em}
.herobar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.filebtn{cursor:pointer;display:inline-flex;align-items:center}.filebtn input{display:none}
/* Builder */
.build{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:20px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;position:sticky;top:96px}
.steps button{width:100%;text-align:left;border:1px solid transparent;background:none;padding:9px 11px;border-radius:12px;display:flex;gap:11px;align-items:center;font-weight:500;color:var(--muted)}
.steps button:hover{color:var(--ink)}
.steps button span{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.82rem;flex:none;font-family:var(--f-display);color:var(--gold)}
.steps button.on{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:700}
.steps button.on span{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:var(--gold-ink);box-shadow:0 0 14px rgba(226,174,82,.4)}
.panel{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:22px 24px;min-width:0;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.panel>h2:first-child{font-size:1.45rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.card{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);padding:11px 13px;text-align:left;display:grid;gap:3px;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2)}
.card b{font-family:var(--f-display);font-size:1rem;color:var(--ink);font-weight:600}
.card small{color:var(--muted);font-size:.8rem}
.card .sub{font-style:italic;color:var(--faint)}
.card.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(226,174,82,.16),rgba(226,174,82,.04));box-shadow:var(--glow)}
.card.on b{color:var(--gold-hi)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.opt{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);padding:11px 13px;text-align:left;display:grid;gap:4px}
.opt:hover{border-color:var(--line2)}
.opt span{font-size:.87rem;color:var(--muted)}
.opt.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(226,174,82,.14),rgba(226,174,82,.03));box-shadow:var(--glow)}
.opt.on b{color:var(--gold-hi)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--sunk);width:max-content}
.stepper button{border:0;background:var(--raised);width:38px;height:38px;font-size:1.2rem;font-weight:700;color:var(--gold)}
.stepper button:hover{background:#3a2b1f}
.stepper b{min-width:50px;text-align:center;font-size:1.2rem;font-family:var(--f-display);color:var(--gold-hi)}
.stepper.sm button{width:30px;height:30px;font-size:1rem}.stepper.sm b{min-width:58px;font-size:.95rem}
.rolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);width:55%}
td{font-family:var(--f-display);color:var(--gold-hi)}
.bgplus,.asiplus{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-block:9px}
.bp{display:grid;gap:5px}.bp>span{font-size:.86rem;font-weight:700}
.abgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-block:12px}
.abbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:7px;background:var(--bg2)}
.abbox.prim{border-color:rgba(226,174,82,.55);box-shadow:0 0 18px rgba(226,174,82,.08)}
.abn{font-family:var(--f-display);font-weight:600;color:var(--ink)}
.abres{display:flex;align-items:baseline;gap:8px}.abres b{font-size:1.7rem;font-family:var(--f-display);color:var(--gold-hi)}.abres span{color:var(--gold);font-weight:700}
.abbox small{color:var(--faint);font-size:.78rem;min-height:1em}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 16px;margin-block:12px}
.sk{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--line);color:var(--faint)}
.sk.p1,.sk.p2{color:var(--ink);font-weight:500}.sk.p2 b{color:var(--gold-hi)}
.sk small{font-size:.72rem}
.stats3{display:flex;gap:10px;flex-wrap:wrap}
.stats3>div{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:9px 16px;display:grid}
.stats3 span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stats3 b{font-size:1.5rem;font-family:var(--f-display);color:var(--gold-hi)}
.cnt{font-family:var(--f-body);font-size:.85rem;color:var(--gold);font-weight:700;margin-left:6px}
.wlist{display:grid;gap:9px}
.wrow{display:flex;flex-wrap:wrap;align-items:end;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--bg2)}
.wrow .wn{flex:1 1 160px;display:grid}.wrow .wn small{color:var(--muted)}
.wrow .wv{font-family:var(--f-display);color:var(--gold-hi);flex:0 0 auto;align-self:center}
.wrow .fld{width:115px}
.x{border:0;background:none;font-size:1.5rem;color:var(--muted);line-height:1;padding:4px 6px}
.x:hover{color:var(--wine)}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.plain{padding-left:18px}
.mch{margin-top:28px}.mch small{margin-left:8px}
.mcbox{display:grid;gap:10px}.mcrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mcrow>b{font-family:var(--f-display);font-size:1.05rem;color:var(--gold-hi)}.mcrow .x{margin-left:auto}
.clsh{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;font-size:1.15rem}
.finish{border:1px solid var(--gold);border-radius:16px;padding:18px;margin-block:18px;background:linear-gradient(180deg,rgba(226,174,82,.12),rgba(226,174,82,.02));display:grid;gap:10px;box-shadow:var(--glow)}
.finish h3{margin:0}
.finish .chips{gap:10px}
.summary{position:sticky;top:96px;background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:4px}
.summary .shd{display:flex;gap:12px;align-items:center}
.summary .sigil{width:52px;height:52px;font-size:1.05rem}
.summary h3{margin:0;color:var(--ink)}.summary .sub{color:var(--muted);font-size:.86rem;margin:2px 0 10px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sgrid>div{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:7px 6px;display:grid;text-align:center}
.sgrid span{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sgrid b{font-size:1.15rem;font-family:var(--f-display);color:var(--gold-hi)}
.abmini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;text-align:center}
.abmini span{display:block;font-size:.64rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.abmini b{display:block;font-family:var(--f-display);color:var(--ink)}
.abmini small{font-size:.75rem;color:var(--gold);font-weight:700}
.warn{padding-left:18px;margin:4px 0;font-size:.88rem;color:#F0A27A}
.warn li{margin-block:4px}
.warn button{border:0;background:none;color:inherit;text-align:left;padding:2px 0;font:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.warn button:hover{text-decoration-style:solid;color:#FFC29E}
.ok{color:var(--moss);font-weight:700}
.feats{display:grid;gap:2px}
.feats details{border-bottom:1px solid var(--line);padding:7px 0}
.feats summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}
.feats summary::-webkit-details-marker{display:none}
.feats summary b{font-weight:500}
.feats summary b::before{content:"✦";color:var(--gold);font-size:.7rem;margin-right:8px;opacity:.7}
.feats details[open] summary b{color:var(--gold-hi)}
.feats summary small{color:var(--faint);font-size:.8rem;text-align:right}
.feats p{margin:6px 0 4px 20px;font-size:.94rem;max-width:68ch;color:var(--muted)}
/* Bogen */
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}
.shead .who{display:flex;gap:16px;align-items:center;min-width:0}
.shead .sigil{width:72px;height:72px;font-size:1.45rem}
.shead p{margin:4px 0 0;color:var(--muted)}
.sctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:7px 13px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink)}
.notice{background:rgba(224,118,58,.08);border:1px solid rgba(224,118,58,.35);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:.93rem}
.notice .warn{margin:6px 0 0}
.vitals{display:grid;grid-template-columns:120px minmax(290px,2fr) repeat(5,minmax(92px,1fr));gap:9px}
.vt{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;align-content:start;gap:3px;text-align:left;color:var(--ink)}
.vt span{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.vt b{font-size:1.6rem;font-family:var(--f-display);color:var(--gold-hi);line-height:1.15;font-weight:600}
.vt b small{font-size:.8rem;color:var(--muted);font-family:var(--f-body)}
.vt.roll:hover,.abm:hover,.sv:hover,.skills button:hover,.rb:hover{border-color:var(--gold);box-shadow:0 0 16px rgba(226,174,82,.18)}
.vt.ac{text-align:center;justify-items:center;border-color:var(--line2);border-radius:14px 14px 50px 50px;padding-bottom:16px;background:radial-gradient(circle at 50% 30%,rgba(226,174,82,.16),transparent 70%),var(--surface)}
.vt.ac b{font-size:2.4rem}
