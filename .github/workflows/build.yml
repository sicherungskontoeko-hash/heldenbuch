# Baut bei jedem Hochladen automatisch alle Apps:
#   Android (APK), Windows (Installer + portable EXE), macOS (DMG), Linux (AppImage)
# und veröffentlicht die Web-App (für iPhone & Browser) auf GitHub Pages.
name: Heldenbuch bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android-App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Web-Dateien in die Android-App kopieren
        run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Heldenbuch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Heldenbuch-Android
          path: Heldenbuch.apk

  desktop:
    name: PC-App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund
      - name: App bauen
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Heldenbuch-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  pages:
    name: Web-App (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Download-Seite (Release)
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: Heldenbuch-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: Heldenbuch 1.4.${{ github.run_number }}
          body: |
            **Android:** Heldenbuch.apk herunterladen und öffnen (Installation aus unbekannten Quellen erlauben).
            **Windows:** Heldenbuch-Setup-….exe (Installer) oder Heldenbuch-Portable-….exe (ohne Installation).
            **Mac:** Heldenbuch-….dmg (wird nachgeliefert, sobald der Mac-Bau fertig ist) öffnen, App in „Programme“ ziehen, beim ersten Start Rechtsklick → Öffnen.
            **Linux:** Heldenbuch-….AppImage ausführbar machen und starten.
            **iPhone/iPad:** Web-App in Safari öffnen und „Zum Home-Bildschirm“ wählen (Link siehe Anleitung).
          files: dl/**/*

  mac:
    name: PC-App (macOS, nachgeliefert)
    needs: [release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund
      - name: App bauen
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Zum Release hinzufügen
        run: gh release upload "v1.4.${{ github.run_number }}" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
