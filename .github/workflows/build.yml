# Baut bei jedem Hochladen automatisch alle Apps:
#   Android (APK), Windows (Installer + portable EXE), macOS (DMG), Linux (AppImage)
# und veröffentlicht die Web-App (für iPhone und Browser) auf GitHub Pages.
# Die App-Dateien (www/, Heldenbuch.html) baut der erste Schritt immer frisch aus quelle/.
name: Fablecrown bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
env:
  PAGES_URL: https://sicherungskontoeko-hash.github.io/heldenbuch/

jobs:
  web:
    name: Web-Dateien aus den Quellen bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Versionsnummer (1.9.<Laufnummer>)
        shell: bash
        run: echo "HB_VERSION=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: App-Dateien bauen (www/ und Heldenbuch.html)
        run: bash quelle/build_www.sh
      - name: Abgleich mit dem Repo (nur Hinweis)
        run: |
          if ! git diff --quiet -I 'var BUILD = ' -- www/index.html Heldenbuch.html; then
            echo "::warning::www/ im Repo war nicht aktuell. Veröffentlicht wird der frische Build aus quelle/."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            www
            Heldenbuch.html

  android:
    name: Android-App
    needs: [web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Versionsnummer (1.9.<Laufnummer>)
        shell: bash
        run: echo "HB_VERSION=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Versionsnummer in die Android-App
        run: sed -i -E "s/versionCode [0-9]+/versionCode $((100 + ${{ github.run_number }}))/; s/versionName \"[^\"]*\"/versionName \"$HB_VERSION\"/" android/app/build.gradle && grep -E "versionCode|versionName" android/app/build.gradle
      - name: Web-Dateien in die Android-App kopieren
        run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Fablecrown.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Heldenbuch-Android
          path: Fablecrown.apk

  desktop:
    name: PC-App (${{ matrix.os }})
    needs: [web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund
      - name: Versionsnummer (1.9.<Laufnummer>)
        shell: bash
        run: echo "HB_VERSION=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: App bauen
        shell: bash
        run: npx electron-builder --publish never -c.extraMetadata.version=$HB_VERSION
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Heldenbuch-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  pages:
    name: Web-App (GitHub Pages)
    needs: [web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Kurz warten (GitHub braucht einen Moment, bis die Dateien abrufbar sind)
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Zweiter Versuch nach einer Störung bei GitHub
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  release:
    name: Download-Seite (Release)
    needs: [android, desktop]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      # Versionsnummer aus package.json (z. B. 1.8.0 → v1.8.<Laufnummer>), damit Release und App übereinstimmen
      - uses: actions/checkout@v5
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: ver
        name: Version lesen
        run: |
          V=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "tag=v$V.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Fablecrown $V.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Übergang – Kopien unter den alten Namen (Heldenbuch …) für bestehende Links
        run: |
          for f in $(find dl -type f -name 'Fablecrown*'); do cp "$f" "$(dirname "$f")/$(basename "$f" | sed 's/^Fablecrown/Heldenbuch/')"; done
          find dl -type f | sort
          pattern: Heldenbuch-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            ## Alles auf einer Seite: ${{ env.PAGES_URL }}download.html

            Diese Links laden immer die neueste Version:

            | Gerät | Datei | Hinweis |
            | --- | --- | --- |
            | Android | [Fablecrown.apk](https://github.com/${{ github.repository }}/releases/latest/download/Fablecrown.apk) | Öffnen, Installation aus dieser Quelle erlauben. Danach aktualisiert sich die App selbst – bereits installiert? Nicht neu laden (sonst vorher «Alles sichern»). |
            | Windows | [Fablecrown-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/Fablecrown-Setup.exe) | Installer (empfohlen, nötig für Claude Desktop). Bei der Windows-Warnung: «Weitere Informationen» › «Trotzdem ausführen». |
            | Windows ohne Installation | [Fablecrown-Portable.exe](https://github.com/${{ github.repository }}/releases/latest/download/Fablecrown-Portable.exe) | Startet direkt, etwas langsamer. |
            | Mac (Intel und Apple) | [Fablecrown.dmg](https://github.com/${{ github.repository }}/releases/latest/download/Fablecrown.dmg) | Wird einige Minuten nach den anderen nachgeliefert. App in «Programme» ziehen; beim ersten Start Systemeinstellungen › Datenschutz und Sicherheit › «Trotzdem öffnen». |
            | Linux | [Fablecrown.AppImage](https://github.com/${{ github.repository }}/releases/latest/download/Fablecrown.AppImage) | Ausführbar machen und starten. |
            | iPhone, iPad, Browser | [Web-App](${{ env.PAGES_URL }}) | In Safari öffnen › Teilen › «Zum Home-Bildschirm». |

            Fablecrown (bisher Heldenbuch): Die Dateien heissen jetzt «Fablecrown …». Für alte Links liegen sie in dieser Übergangszeit zusätzlich unter den alten Namen «Heldenbuch …» bei. Helden und Einstellungen bleiben erhalten (Android: gleiche App; PC: gleicher Datenordner). Auf dem Mac erscheint die App neu als «Fablecrown» – die alte «Heldenbuch»-App danach einfach löschen.

            Version ${{ steps.ver.outputs.tag }}. Die App ist nicht von Apple oder Microsoft signiert; deshalb die Warnungen beim ersten Start.
          files: dl/**/*

  mac:
    name: PC-App (macOS, nachgeliefert)
    needs: [release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund
      - name: Versionsnummer (1.9.<Laufnummer>)
        shell: bash
        run: echo "HB_VERSION=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: App bauen
        run: npx electron-builder --mac --publish never -c.extraMetadata.version=$HB_VERSION
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Zum Release hinzufügen
        run: |
          for f in dist/Fablecrown*.dmg; do cp "$f" "${f/Fablecrown/Heldenbuch}"; done
          gh release upload "${{ needs.release.outputs.tag }}" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
