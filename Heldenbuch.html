<style>
/* Layout: Kerzenlicht-Archiv – eine dunkle, warme Bühne; oben schlichte Navigation, darunter Heldenkarten, Builder-Kapitel und Spielbogen als leuchtende Tafeln. Bewusst nur ein (dunkles) Erscheinungsbild. */
:root{
  color-scheme:dark;
  --bg:#130E0A; --bg2:#1A130E; --surface:#211812; --raised:#2B2018; --sunk:#0F0B08;
  --ink:#F1E6D0; --muted:#B9A587; --faint:#8A7863; --line:rgba(222,176,104,.16); --line2:rgba(222,176,104,.32);
  --gold:#E2AE52; --gold-hi:#F6D58E; --gold-ink:#1B1209; --ember:#E0763A; --wine:#B9474A; --moss:#86B07A; --arcane:#B28DE0;
  --glow:0 0 0 1px var(--line2), 0 0 24px rgba(226,174,82,.12);
  --f-display:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif; --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(1200px 700px at 15% -10%,rgba(224,118,58,.14),transparent 60%),radial-gradient(900px 600px at 100% 10%,rgba(178,141,224,.07),transparent 60%),radial-gradient(1000px 800px at 50% 120%,rgba(226,174,82,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#top,#view,.foot,#toast,#modal{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(226,174,82,.35)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.03em;color:var(--gold-hi)}
h1{font-size:2rem;line-height:1.15} h2{font-size:1.22rem;margin-block:4px 12px} h3{font-size:1.02rem;margin-block:20px 9px;color:var(--gold)} h4{font-size:.86rem;margin-block:14px 7px;color:var(--muted);letter-spacing:.08em}
h2 small,h3 small,h4 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Kopf */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(19,14,10,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px 18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:10px;color:var(--gold-hi);border:0;background:none;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs button{border:1px solid transparent;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--gold-ink);background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 0 18px rgba(226,174,82,.35)}
.curhero{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;max-width:240px;min-width:0}
.curhero .sigil{width:30px;height:30px;font-size:.78rem}
.curhero span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.savest{display:block;text-align:right;font-size:.74rem;color:var(--faint);padding-bottom:6px}
/* Grundelemente */
select,input[type=number],input[type=text],input[type=search],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%;color:var(--ink)}
select option,select optgroup{background:var(--surface);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select:focus,input:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(226,174,82,.18)}
textarea{resize:vertical;line-height:1.45}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-radius:10px;padding:9px 18px;font-weight:700;white-space:nowrap;letter-spacing:.02em;box-shadow:0 2px 14px rgba(226,174,82,.18)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:none;border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--gold);background:rgba(226,174,82,.06)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn.big{padding:13px 24px;font-size:1.05rem}
.btn.danger{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:none}
.btn.dmg{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:none}
.btn.heal{background:var(--moss);border-color:var(--moss);color:#14200F;box-shadow:none}
.link{border:0;background:none;color:var(--gold);text-decoration:underline;text-underline-offset:3px;padding:0;font-weight:500}
#view{padding-block:22px 60px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:var(--gold-ink);font-weight:700;box-shadow:0 0 14px rgba(226,174,82,.28)}
.chip:disabled{opacity:.35;cursor:default}
.chip i,.spell summary i{font-style:normal;font-size:.68rem;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-left:4px;opacity:.75}
.tag{background:rgba(178,141,224,.14);border:1px solid rgba(178,141,224,.3);color:#E3D3F7;border-radius:999px;padding:4px 12px;font-size:.88rem}
.hint{color:var(--muted);font-size:.94rem;margin:6px 0 12px;max-width:72ch}
.empty{color:var(--muted);font-style:italic}
.calc{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:.93rem}
.calc b{color:var(--gold-hi);font-family:var(--f-display)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-block:12px;background:var(--bg2)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-block:9px}
.row>.fld{flex:1 1 180px}
.row.misc>.fld{flex:1 1 115px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.fld em{font-size:.8rem;color:var(--faint);font-style:normal}
/* Heldenauswahl */
.hero-intro{display:grid;gap:6px;margin-bottom:22px;text-align:center;justify-items:center}
.hero-intro h1{font-size:clamp(1.8rem,4vw,2.6rem);text-shadow:0 0 30px rgba(226,174,82,.3)}
.hero-intro p{color:var(--muted);margin:0;max-width:56ch}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.hero{position:relative;background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;display:grid;gap:12px;justify-items:center;text-align:center;transition:border-color .2s,box-shadow .2s,transform .2s}
.hero:hover{border-color:var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 30px rgba(226,174,82,.08);transform:translateY(-2px)}
.hero.cur{border-color:var(--gold);box-shadow:var(--glow)}
.hero .curlbl{position:absolute;top:10px;right:12px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hero h3{margin:0;font-size:1.12rem;color:var(--ink)}
.hero p{margin:0;color:var(--muted);font-size:.9rem}
.hero .mini{display:flex;gap:14px;font-size:.85rem;color:var(--muted)}
.hero .mini b{color:var(--gold-hi);font-family:var(--f-display);font-size:1.05rem;margin-right:3px}
.hero .warnline{color:#F0A27A;font-size:.82rem;margin:0}
.hero .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hero .acts2{display:flex;gap:2px 12px;flex-wrap:wrap;justify-content:center;font-size:.86rem}
.hero .acts2 button{border:0;background:none;color:var(--muted);padding:2px 0;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.hero .acts2 button:hover{color:var(--ink)}
.hero .acts2 .del{color:var(--wine)}
.sigil{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.7rem;color:var(--gold-hi);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--h) 55%,#2b2018),#140e0a 75%);box-shadow:0 0 0 2px var(--h),0 0 0 6px rgba(0,0,0,.35),0 0 0 7px color-mix(in srgb,var(--h) 45%,transparent),0 0 30px color-mix(in srgb,var(--h) 35%,transparent);letter-spacing:.04em;flex:none}
.newhero{border:1.5px dashed var(--line2);border-radius:18px;background:rgba(226,174,82,.03);display:grid;place-items:center;align-content:center;gap:10px;padding:24px;min-height:250px;text-align:center;color:var(--muted)}
.newhero .plus{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-size:2rem;color:var(--gold);font-family:var(--f-display);box-shadow:0 0 24px rgba(226,174,82,.2)}
.newhero b{font-family:var(--f-display);color:var(--gold-hi);font-size:1.05rem;letter-spacing:.04em}
.herobar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.filebtn{cursor:pointer;display:inline-flex;align-items:center}.filebtn input{display:none}
/* Builder */
.build{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:20px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;position:sticky;top:96px}
.steps button{width:100%;text-align:left;border:1px solid transparent;background:none;padding:9px 11px;border-radius:12px;display:flex;gap:11px;align-items:center;font-weight:500;color:var(--muted)}
.steps button:hover{color:var(--ink)}
.steps button span{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.82rem;flex:none;font-family:var(--f-display);color:var(--gold)}
.steps button.on{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:700}
.steps button.on span{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:var(--gold-ink);box-shadow:0 0 14px rgba(226,174,82,.4)}
.panel{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:22px 24px;min-width:0;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.panel>h2:first-child{font-size:1.45rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.card{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);padding:11px 13px;text-align:left;display:grid;gap:3px;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2)}
.card b{font-family:var(--f-display);font-size:1rem;color:var(--ink);font-weight:600}
.card small{color:var(--muted);font-size:.8rem}
.card .sub{font-style:italic;color:var(--faint)}
.card.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(226,174,82,.16),rgba(226,174,82,.04));box-shadow:var(--glow)}
.card.on b{color:var(--gold-hi)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.opt{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);padding:11px 13px;text-align:left;display:grid;gap:4px}
.opt:hover{border-color:var(--line2)}
.opt span{font-size:.87rem;color:var(--muted)}
.opt.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(226,174,82,.14),rgba(226,174,82,.03));box-shadow:var(--glow)}
.opt.on b{color:var(--gold-hi)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--sunk);width:max-content}
.stepper button{border:0;background:var(--raised);width:38px;height:38px;font-size:1.2rem;font-weight:700;color:var(--gold)}
.stepper button:hover{background:#3a2b1f}
.stepper b{min-width:50px;text-align:center;font-size:1.2rem;font-family:var(--f-display);color:var(--gold-hi)}
.stepper.sm button{width:30px;height:30px;font-size:1rem}.stepper.sm b{min-width:58px;font-size:.95rem}
.rolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);width:55%}
td{font-family:var(--f-display);color:var(--gold-hi)}
.bgplus,.asiplus{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-block:9px}
.bp{display:grid;gap:5px}.bp>span{font-size:.86rem;font-weight:700}
.abgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-block:12px}
.abbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:7px;background:var(--bg2)}
.abbox.prim{border-color:rgba(226,174,82,.55);box-shadow:0 0 18px rgba(226,174,82,.08)}
.abn{font-family:var(--f-display);font-weight:600;color:var(--ink)}
.abres{display:flex;align-items:baseline;gap:8px}.abres b{font-size:1.7rem;font-family:var(--f-display);color:var(--gold-hi)}.abres span{color:var(--gold);font-weight:700}
.abbox small{color:var(--faint);font-size:.78rem;min-height:1em}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 16px;margin-block:12px}
.sk{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--line);color:var(--faint)}
.sk.p1,.sk.p2{color:var(--ink);font-weight:500}.sk.p2 b{color:var(--gold-hi)}
.sk small{font-size:.72rem}
.stats3{display:flex;gap:10px;flex-wrap:wrap}
.stats3>div{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:9px 16px;display:grid}
.stats3 span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stats3 b{font-size:1.5rem;font-family:var(--f-display);color:var(--gold-hi)}
.cnt{font-family:var(--f-body);font-size:.85rem;color:var(--gold);font-weight:700;margin-left:6px}
.wlist{display:grid;gap:9px}
.wrow{display:flex;flex-wrap:wrap;align-items:end;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--bg2)}
.wrow .wn{flex:1 1 160px;display:grid}.wrow .wn small{color:var(--muted)}
.wrow .wv{font-family:var(--f-display);color:var(--gold-hi);flex:0 0 auto;align-self:center}
.wrow .fld{width:115px}
.x{border:0;background:none;font-size:1.5rem;color:var(--muted);line-height:1;padding:4px 6px}
.x:hover{color:var(--wine)}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.plain{padding-left:18px}
.mch{margin-top:28px}.mch small{margin-left:8px}
.mcbox{display:grid;gap:10px}.mcrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mcrow>b{font-family:var(--f-display);font-size:1.05rem;color:var(--gold-hi)}.mcrow .x{margin-left:auto}
.clsh{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;font-size:1.15rem}
.finish{border:1px solid var(--gold);border-radius:16px;padding:18px;margin-block:18px;background:linear-gradient(180deg,rgba(226,174,82,.12),rgba(226,174,82,.02));display:grid;gap:10px;box-shadow:var(--glow)}
.finish h3{margin:0}
.finish .chips{gap:10px}
.summary{position:sticky;top:96px;background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:4px}
.summary .shd{display:flex;gap:12px;align-items:center}
.summary .sigil{width:52px;height:52px;font-size:1.05rem}
.summary h3{margin:0;color:var(--ink)}.summary .sub{color:var(--muted);font-size:.86rem;margin:2px 0 10px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sgrid>div{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:7px 6px;display:grid;text-align:center}
.sgrid span{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sgrid b{font-size:1.15rem;font-family:var(--f-display);color:var(--gold-hi)}
.abmini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;text-align:center}
.abmini span{display:block;font-size:.64rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.abmini b{display:block;font-family:var(--f-display);color:var(--ink)}
.abmini small{font-size:.75rem;color:var(--gold);font-weight:700}
.warn{padding-left:18px;margin:4px 0;font-size:.88rem;color:#F0A27A}
.warn li{margin-block:4px}
.warn button{border:0;background:none;color:inherit;text-align:left;padding:2px 0;font:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.warn button:hover{text-decoration-style:solid;color:#FFC29E}
.ok{color:var(--moss);font-weight:700}
.feats{display:grid;gap:2px}
.feats details{border-bottom:1px solid var(--line);padding:7px 0}
.feats summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}
.feats summary::-webkit-details-marker{display:none}
.feats summary b{font-weight:500}
.feats summary b::before{content:"✦";color:var(--gold);font-size:.7rem;margin-right:8px;opacity:.7}
.feats details[open] summary b{color:var(--gold-hi)}
.feats summary small{color:var(--faint);font-size:.8rem;text-align:right}
.feats p{margin:6px 0 4px 20px;font-size:.94rem;max-width:68ch;color:var(--muted)}
/* Bogen */
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}
.shead .who{display:flex;gap:16px;align-items:center;min-width:0}
.shead .sigil{width:72px;height:72px;font-size:1.45rem}
.shead p{margin:4px 0 0;color:var(--muted)}
.sctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:7px 13px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink)}
.notice{background:rgba(224,118,58,.08);border:1px solid rgba(224,118,58,.35);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:.93rem}
.notice .warn{margin:6px 0 0}
.vitals{display:grid;grid-template-columns:120px minmax(290px,2fr) repeat(5,minmax(92px,1fr));gap:9px}
.vt{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;align-content:start;gap:3px;text-align:left;color:var(--ink)}
.vt span{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.vt b{font-size:1.6rem;font-family:var(--f-display);color:var(--gold-hi);line-height:1.15;font-weight:600}
.vt b small{font-size:.8rem;color:var(--muted);font-family:var(--f-body)}
.vt.roll:hover,.abm:hover,.sv:hover,.skills button:hover,.rb:hover{border-color:var(--gold);box-shadow:0 0 16px rgba(226,174,82,.18)}
.vt.ac{text-align:center;justify-items:center;border-color:var(--line2);border-radius:14px 14px 50px 50px;padding-bottom:16px;background:radial-gradient(circle at 50% 30%,rgba(226,174,82,.16),transparent 70%),var(--surface)}
.vt.ac b{font-size:2.4rem}
.hpline{display:flex;align-items:baseline;gap:6px}.hpline b{font-size:2.1rem}.hpline small{color:var(--muted)}
.hpbar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:4px 0 8px;border:1px solid var(--line)}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--ember),var(--gold));transition:width .35s}
.hpctl{display:flex;gap:6px;flex-wrap:wrap}.hpctl input{width:80px;flex:none}
.death{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(185,71,74,.1);border:1px solid var(--wine);border-radius:14px;padding:10px 14px;margin-top:9px}
.srow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-block:14px}
.exh{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}.exh select{width:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.blk{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ab{display:grid;gap:5px}
.abm{border:1px solid var(--line);background:radial-gradient(circle at 50% 20%,rgba(226,174,82,.1),transparent 70%),var(--sunk);border-radius:14px;padding:9px 4px 10px;display:grid;justify-items:center;gap:1px;color:var(--ink)}
.abm span{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.abm b{font-family:var(--f-display);font-size:1.75rem;line-height:1.15;color:var(--gold-hi);font-weight:600}
.abm small{border:1px solid var(--line2);border-radius:999px;padding:0 10px;font-size:.82rem;background:var(--surface)}
.sv{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px 6px;font-size:.84rem;color:var(--faint)}
.sv.p{color:var(--ink);font-weight:700;border-color:rgba(226,174,82,.55)}
.skills{list-style:none;margin:0;padding:0}
.skills button{width:100%;border:0;border-bottom:1px dotted var(--line);background:none;display:flex;gap:9px;align-items:center;padding:6px 4px;text-align:left;border-radius:6px}
.skills button:hover{box-shadow:none;background:rgba(226,174,82,.06)}
.skills span{flex:1}.skills small{color:var(--faint);font-size:.72rem}
.skills b{font-family:var(--f-display);color:var(--gold-hi);font-weight:600}
.pp{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.pp.p1{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(226,174,82,.6)}
.pp.p2{background:var(--gold-hi);border-color:var(--gold-hi);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold),0 0 8px rgba(226,174,82,.7)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:.93rem}.dl dt{color:var(--muted)}.dl dd{margin:0}
.atks{display:grid;gap:4px}
.atk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px}
.atk .an{flex:1 1 180px;display:grid;min-width:0}.atk .an small{color:var(--muted);font-size:.8rem}
.atk abbr{text-decoration:underline dotted;cursor:help}
.rb{border:1px solid var(--line2);background:var(--sunk);border-radius:10px;padding:6px 12px;font-family:var(--f-display);font-weight:600;color:var(--gold-hi);min-width:56px}
.rb small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.75rem}
.slots{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:12px}
.sl{display:grid;gap:4px}.sl span{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle at 40% 35%,var(--gold-hi),var(--gold) 60%,#8a5d1e);padding:0;box-shadow:0 0 10px rgba(226,174,82,.45)}
.pip.used{background:transparent;border-color:var(--line2);box-shadow:none}
.res{display:grid;gap:9px}
.rs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:9px}
.rs>div:first-child{display:grid}.rs small{color:var(--muted);font-size:.8rem}
.pool{display:flex;gap:6px}.pool input{width:84px}
.splist{display:grid;gap:5px}
.splist h4{margin-top:12px}
.spell{border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.spell[open]{border-color:var(--line2)}
.spell summary{cursor:pointer;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;list-style:none}
.spell summary::-webkit-details-marker{display:none}
.spell summary b{font-weight:500}
.spell summary small{margin-left:auto;color:var(--faint);font-size:.8rem}
.spell summary em{font-style:normal;font-size:.74rem;background:rgba(178,141,224,.14);color:#E3D3F7;border-radius:999px;padding:0 9px}
.castbtns{display:flex;gap:6px;align-items:center;margin-left:8px}
.spell summary small{margin-left:auto}
.btn.cast{padding:4px 12px}
.mat{font-size:.88rem;color:var(--muted);border-left:2px solid var(--line2);padding-left:10px}
.mat b{color:var(--ink);font-weight:600}.mat small{color:var(--faint)}
.mat.cost{border-left-color:var(--gold)}.mat.cost b{color:var(--gold-hi)}
.mat .used{font-size:.74rem;font-weight:700;background:rgba(185,71,74,.2);color:#F3B0A0;border:1px solid rgba(185,71,74,.5);border-radius:999px;padding:0 8px;margin-left:4px}
.spell summary i.gm{color:var(--gold);border-color:var(--gold)}
.noslot{font-size:.78rem;color:var(--faint);font-style:italic}
.spell.concon{border-color:var(--arcane);box-shadow:0 0 18px rgba(178,141,224,.18)}
.spell summary em.cc{background:var(--arcane);color:#1a1024;font-weight:700}
.upc{align-items:center;margin-bottom:8px}.upc>span{font-size:.82rem;color:var(--muted)}
.concchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--arcane);background:rgba(178,141,224,.12);color:#E3D3F7;border-radius:999px;padding:3px 4px 3px 12px;font-size:.9rem}
.concchip .x{font-size:1.1rem;color:#E3D3F7;padding:0 6px}
.sbody{padding:0 12px 12px}.sbody p{margin:4px 0 9px;max-width:70ch}.sbody .meta{font-size:.82rem;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:240px;overflow:auto}
.log li{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:5px 0;border-bottom:1px solid var(--line)}
.log li small{grid-column:1/-1;color:var(--faint);font-size:.78rem}
.log b{font-family:var(--f-display);color:var(--gold-hi)}.log b.crit{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.logblk{margin-top:16px}
.logs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

.die.rolling-x svg{filter:drop-shadow(0 0 8px rgba(226,174,82,.35))}

<script>
/* ==== Heldenbuch als eigenständige App: Speicher auf dem Gerät + Online-Tisch über MQTT (WebSocket) ====

var APP_MODE = 'app';
const HB_BROKERS = {
  hivemq: ['HiveMQ (Standard)', 'wss://broker.hivemq.com:8884/mqtt'],
  emqx: ['EMQX (Ersatz)', 'wss://broker.emqx.io:8084/mqtt'],
  mosquitto: ['Mosquitto (Test)', 'wss://test.mosquitto.org:8081']

const HB_PREFIX = 'heldenbuch-v1/';
const hbLs = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
function hbUid() { let u = hbLs.get('hb_uid', ''); if (!u) { u = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); hbLs.set('hb_uid', u); } return u; }
function hbServer() { const k = hbLs.get('hb_server', 'hivemq'); if (k === 'custom') return hbLs.get('hb_server_url', HB_BROKERS.hivemq[1]); return (HB_BROKERS[k] || HB_BROKERS.hivemq)[1]; }

/* ---------- Kleiner MQTT-3.1.1-Client (QoS 0, retained) ---------- */
class HbMqtt {
  constructor() { this.subs = new Map(); this.queue = new Map(); this.state = 'offline'; this.listeners = new Set(); this.buf = new Uint8Array(0); this.pid = 1; this.retry = 0; this.want = false; }
  onState(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  setState(s) { if (this.state === s) return; this.state = s; this.listeners.forEach((f) => { try { f(s); } catch (e) {} }); }
  start() { this.want = true; if (this.ws && (this.state === 'online' || this.state === 'verbinde')) return; this.open(); }
  stop() { this.want = false; clearTimeout(this.rt); clearInterval(this.ping); try { this.ws && this.ws.close(); } catch (e) {} this.ws = null; this.setState('offline'); }
  open() {
    clearTimeout(this.rt); this.setState('verbinde');
    let ws; try { ws = new WebSocket(hbServer(), 'mqtt'); } catch (e) { return this.later(); }
    ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
    ws.onopen = () => { const id = 'hb-' + hbUid().slice(-10) + '-' + Math.random().toString(36).slice(2, 6); this.send(this.pkt(0x10, [this.str('MQTT'), [4, 0x02, 0, 60]], [this.str(id)])); };
    ws.onmessage = (ev) => { const d = new Uint8Array(ev.data); const b = new Uint8Array(this.buf.length + d.length); b.set(this.buf); b.set(d, this.buf.length); this.buf = b; this.drain(); };
    ws.onclose = () => { clearInterval(this.ping); if (this.ws === ws) { this.ws = null; this.setState('offline'); if (this.want) this.later(); } };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  later() { this.setState('offline'); const t = Math.min(30000, 1000 * Math.pow(2, this.retry++)); clearTimeout(this.rt); this.rt = setTimeout(() => this.want && this.open(), t); }
  str(s) { const u = new TextEncoder().encode(s); return [u.length >> 8, u.length & 255, ...u]; }
  len(n) { const o = []; do { let b = n % 128; n = Math.floor(n / 128); if (n > 0) b |= 128; o.push(b); } while (n > 0); return o; }
  pkt(type, varParts, payloadParts) { const body = [].concat(...varParts, ...(payloadParts || [])); return new Uint8Array([type, ...this.len(body.length), ...body]); }
  send(u8) { try { if (this.ws && this.ws.readyState === 1) { this.ws.send(u8); return true; } } catch (e) {} return false; }
  drain() {
    for (;;) {
      const b = this.buf; if (b.length < 2) return;
      let mult = 1, val = 0, i = 1, byte;
      do { if (i >= b.length) return; byte = b[i++]; val += (byte & 127) * mult; mult *= 128; } while (byte & 128);
      if (b.length < i + val) return;
      const type = b[0], body = b.slice(i, i + val); this.buf = b.slice(i + val);
      this.handle(type, body);
    }
  }
  handle(type, body) {
    const t = type >> 4;
    if (t === 2) { if (body[1] === 0) { this.retry = 0; this.setState('online'); clearInterval(this.ping); this.ping = setInterval(() => this.send(new Uint8Array([0xC0, 0])), 25000); for (const topic of this.subs.keys()) this.sub(topic); for (const [topic, [payload, retain]] of this.queue) this.pub(topic, payload, retain); this.queue.clear(); } else { this.setState('fehler'); try { this.ws.close(); } catch (e) {} } }
    else if (t === 3) { const qos = (type >> 1) & 3; const tl = (body[0] << 8) | body[1]; const topic = new TextDecoder().decode(body.slice(2, 2 + tl)); let p = 2 + tl; if (qos > 0) { const id = [body[p], body[p + 1]]; p += 2; if (qos === 1) this.send(new Uint8Array([0x40, 2, id[0], id[1]])); } const msg = new TextDecoder().decode(body.slice(p)); this.dispatch(topic, msg); }
  }
  match(filter, topic) { const f = filter.split('/'), t = topic.split('/'); for (let i = 0; i < f.length; i++) { if (f[i] === '#') return true; if (f[i] !== '+' && f[i] !== t[i]) return false; } return f.length === t.length; }
  dispatch(topic, msg) { for (const [f, fns] of this.subs) if (this.match(f, topic)) fns.forEach((fn) => { try { fn(topic, msg); } catch (e) {} }); }
  sub(topic) { const id = this.pid++ & 0xffff || 1; this.send(this.pkt(0x82, [[id >> 8, id & 255]], [this.str(topic), [0]])); }
  subscribe(topic, fn) { let s = this.subs.get(topic); if (!s) { s = new Set(); this.subs.set(topic, s); if (this.state === 'online') this.sub(topic); } s.add(fn); this.start();
    return () => { const set = this.subs.get(topic); if (!set) return; set.delete(fn); if (!set.size) { this.subs.delete(topic); const id = this.pid++ & 0xffff || 1; this.send(this.pkt(0xA2, [[id >> 8, id & 255]], [this.str(topic)])); } }; }
  pub(topic, payload, retain) { const u = new TextEncoder().encode(payload); return this.send(this.pkt(0x30 | (retain ? 1 : 0), [this.str(topic)], [Array.from(u)])); }
  publish(topic, payload, retain) { this.start(); if (this.state !== 'online' || !this.pub(topic, payload, retain)) this.queue.set(topic, [payload, retain]); }
}
const HBNET = new HbMqtt();

/* ---------- Datenschicht mit derselben Form wie die Claude-Datenbank ---------- */
const HB_CACHE = new Map();
function hbLocalKeys(prefix) { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('hbdb:' + prefix + '/') && k.slice(('hbdb:' + prefix + '/').length).indexOf('/') < 0) out.push(k.slice(5)); } } catch (e) {} return out; }
function hbSnapDoc(path, val) { return { id: path.split('/').pop(), exists: val !== undefined && val !== null, data: () => (val == null ? undefined : JSON.parse(JSON.stringify(val))) }; }
function hbDoc(path) {
  const remote = path.startsWith('camp/') || path.startsWith('transfer/');
  if (!remote) return {
    id: path.split('/').pop(), path,
    set: async (d) => { hbLs.set('hbdb:' + path, JSON.stringify(d)); },
    delete: async () => { try { localStorage.removeItem('hbdb:' + path); } catch (e) {} },
    get: async () => { const v = hbLs.get('hbdb:' + path, null); return hbSnapDoc(path, v ? JSON.parse(v) : null); },
    onSnapshot: (fn) => { const v = hbLs.get('hbdb:' + path, null); setTimeout(() => fn(hbSnapDoc(path, v ? JSON.parse(v) : null)), 0); return () => {}; }
  };
  const topic = HB_PREFIX + path;
  return {
    id: path.split('/').pop(), path,
    set: async (d) => { HB_CACHE.set(path, d); HBNET.publish(topic, JSON.stringify(d), true); },
    delete: async () => { HB_CACHE.delete(path); HBNET.publish(topic, '', true); },
    get: async () => hbSnapDoc(path, HB_CACHE.get(path)),
    onSnapshot: (fn) => {
      let first = true; const t0 = setTimeout(() => { if (first) { first = false; fn(hbSnapDoc(path, HB_CACHE.get(path))); } }, 1500);
      const off = HBNET.subscribe(topic, (tp, msg) => { let v = null; try { v = msg ? JSON.parse(msg) : null; } catch (e) {} if (v == null) HB_CACHE.delete(path); else HB_CACHE.set(path, v); first = false; clearTimeout(t0); fn(hbSnapDoc(path, v)); });
      return () => { clearTimeout(t0); off(); };
    }
  };
}
function hbCollection(path) {
  const remote = path.startsWith('camp/');
  return {
    path,
    doc: (id) => hbDoc(path + '/' + (id || Math.random().toString(36).slice(2))),
    get: async () => { const keys = remote ? [...HB_CACHE.keys()].filter((k) => k.startsWith(path + '/') && k.slice(path.length + 1).indexOf('/') < 0) : hbLocalKeys(path);
      const docs = keys.map((k) => hbSnapDoc(k, remote ? HB_CACHE.get(k) : JSON.parse(hbLs.get('hbdb:' + k, 'null')))).filter((d) => d.exists); return { docs, empty: !docs.length }; },
    onSnapshot: (fn) => {
      if (!remote) { setTimeout(async () => fn(await hbCollection(path).get()), 0); return () => {}; }
      const map = new Map(); let tm = null; const emit = () => { clearTimeout(tm); tm = setTimeout(() => fn({ docs: [...map.entries()].map(([k, v]) => hbSnapDoc(k, v)), empty: !map.size }), 60); };
      const t0 = setTimeout(emit, 1200);
      const off = HBNET.subscribe(HB_PREFIX + path + '/+', (tp, msg) => { const k = tp.slice(HB_PREFIX.length); let v = null; try { v = msg ? JSON.parse(msg) : null; } catch (e) {} if (v == null) { map.delete(k); HB_CACHE.delete(k); } else { map.set(k, v); HB_CACHE.set(k, v); } emit(); });
      return () => { clearTimeout(t0); clearTimeout(tm); off(); };
    }
  };
}
const HBDB = { doc: hbDoc, collection: hbCollection };
async function hbSaveFile({ filename, data }) {
  const blob = new Blob([data], { type: 'application/json' });

}

function bgOf(ch) {

  const orig = C.res;
  C.res = (l, c) => {
    const e = (c.classes || []).find((x) => x.id === id); const sid = e ? e.subId : C.sub.id;
    let r = orig ? orig(l, c) : [];
    if (sid !== C.sub.id) r = r.filter((x) => !(SRD_SUB_RES[id] || []).includes(x.k));
    if (l >= 3) { const sb = C.subs.find((s) => s.id === sid); if (sb && sb.res) r = r.concat(sb.res(l, c)); }

function itemList(ch) { return (ch.items || []).filter((x) => MAGIC_ITEMS[x.id] || x.custom); }
function itemDef(x) { return MAGIC_ITEMS[x.id] || { name: x.name || 'Gegenstand', text: x.text || '', att: !!x.attNeed }; }
function itemActive(x) { const d = itemDef(x); return (x.eq !== false) && (!d.att || x.att) && !d.cons; }
function attuneCount(ch) { return itemList(ch).filter((x) => itemDef(x).att && x.att).length; }
function itemFx(ch) {
  const out = [];
  for (const x of itemList(ch)) {
    if (!itemActive(x)) continue; const d = itemDef(x); const nm = d.name + (x.label ? ' (' + x.label + ')' : '');
    const h = { id: 'it_' + x.uid, kind: 'item', name: nm, text: d.text, ac: d.ac || 0, save: d.save || 0, dc: d.dc || 0, atk: d.atk || 0, init: 0, speed: 0 };
    if (d.arm && ch.armor && ch.armor !== 'none') h.ac += d.arm;
    if (d.shd && ch.shield) h.ac += d.shd;
    if (d.acBare && (!ch.armor || ch.armor === 'none') && !ch.shield) h.ac += d.acBare;
    if (d.use) { h.uses = d.use.n; h.reset = d.use.reset; h.name = d.use.name || nm; }
    out.push(h);
  }
  return out;
}
function itemSet(ch, abil, breakdown) {
  for (const x of itemList(ch)) { if (!itemActive(x)) continue; const d = itemDef(x); if (!d.set) continue; for (const [k, v] of Object.entries(d.set)) if (abil[k] < v) { abil[k] = v; breakdown[k].push(d.name + ' → ' + v); } }
}
function itemWpn(ch, i) { let b = 0; for (const x of itemList(ch)) { const d = itemDef(x); if (d.wpn && +x.w === i && x.eq !== false) b = Math.max(b, d.wpn); } return b; }
function itemWeight(ch) {
  let kg = 0; for (const g of ch.inv || []) kg += (+g.kg || 0) * (+g.qty || 0);
  for (const x of itemList(ch)) kg += (itemDef(x).kg || 0) * (+x.qty || 1);
  const ar = ARMOR[ch.armor]; if (ar && ar.kg) kg += ar.kg; if (ch.shield) kg += 3;

    h += '</div></section>';
  }

  if (ho.length) h += '<section class="blk"><h2>Handouts</h2>' + ho.map((x) => '<details class="ho"><summary><b>' + esc(x.title || 'Handout') + '</b><small>' + ago(x.t) + '</small>' + (isDM() ? '<button class="x" data-act="hoDel" data-arg="' + x.id + '" aria-label="Handout löschen">×</button>' : '') + '</summary><p>' + esc(x.text).replace(/\n/g, '<br>') + '</p></details>').join('') + '</section>';

function dmNoteGet() { try { return localStorage.getItem('heldenbuch_dm_' + S.camp) || ''; } catch (e) { return S.dmNote || ''; } }
function dmNoteSet(v) { S.dmNote = v; try { localStorage.setItem('heldenbuch_dm_' + S.camp, v); } catch (e) {} if (DB && UID) { clearTimeout(timers.dmn); timers.dmn = setTimeout(() => { DB.collection('data/users/' + UID).doc('n_' + S.camp).set({ kind: 'n', json: JSON.stringify({ camp: S.camp, text: v }) }).catch(() => {}); }, 800); } }
function applyMeta() {
  const ch = cur(); if (!ch || !S.camp) return; const P = ch.play; const M = S.meta;
  P.camps = P.camps || {}; if (!P.camps[S.camp]) { P.camps[S.camp] = Date.now(); P.restSeen = M.rest ? M.rest.id : ''; P.gifts = (M.gifts || []).map((g) => g.id); P.hoSeen = (M.handouts || []).length; commit(false); return; }
  let changed = false;
  if (M.rest && M.rest.id !== P.restSeen) { P.restSeen = M.rest.id; if (!P.dead) { doRest(ch, M.rest.kind, true); bannerToast(M.rest.kind === 'long' ? 'Lange Rast' : 'Kurze Rast', 'Die Spielleitung hat für alle eine Rast eingelegt.'); } changed = true; }
  P.gifts = P.gifts || [];
  for (const g of M.gifts || []) {
    if (P.gifts.includes(g.id)) continue; P.gifts.push(g.id); changed = true;
    if ((g.to !== 'all' && g.to !== UID) || g.from === UID) continue;
    if (g.t < P.camps[S.camp]) continue;
    const got = [];
    if (+g.xp) { ch.xp = (+ch.xp || 0) + +g.xp; got.push(g.xp + ' EP'); }
    if (+g.gm) { const co = coinsOf(ch); co.gm = (+co.gm || 0) + +g.gm; got.push(g.gm + ' GM'); }
    if (g.item && MAGIC_ITEMS[g.item]) { ch.items = ch.items || []; ch.items.push({ uid: uidX(), id: g.item, att: false, eq: true, qty: 1, w: '' }); got.push(MAGIC_ITEMS[g.item].name); }
    if (g.text) { ch.inv = ch.inv || []; ch.inv.push({ n: g.text, qty: 1, kg: 0 }); got.push(g.text); }
    if (got.length) { bannerToast('Beute erhalten', got.join(', ')); pushLog({ label: 'Von der Spielleitung', total: '✦', detail: got.join(', ') }); }
  }
  const nho = (M.handouts || []).length; if (nho > (P.hoSeen || 0)) { const last = M.handouts[nho - 1]; if (last) bannerToast('Neues Handout', last.title || ''); P.hoSeen = nho; changed = true; }
  if (changed) commit(S.view !== 'camp');
}

/* ---------- Rast (gemeinsam für Knopf und Spielleitung) ---------- */
function doRest(ch, kind, silent) {
  const c = derive(ch, S.hb); const P = ch.play;
  if (P.dead) return;
  if (kind === 'long') { P.hp = c.hpMax; P.temp = 0; P.hdUsed = 0; P.slots = {}; P.pact = 0; P.res = {}; P.ds = [0, 0]; P.exh = Math.max(0, (+P.exh || 0) - 1); P.raging = false; P.conc = null; P.fx = {}; if (ch.species === 'human') P.insp = true; (ch.comps || []).forEach((x) => { x.hp = compStat(c, x).hpMax; }); pushLog({ label: 'Lange Rast', total: '✓', detail: 'TP, Trefferwürfel, Zauberplätze und Ressourcen zurückgesetzt' }); }
  else { P.pact = 0; c.res.forEach((r) => { if (r.reset === 'short') P.res[r.k] = 0; else if (r.note && P.res[r.k]) P.res[r.k] = Math.max(0, P.res[r.k] - 1); }); pushLog({ label: 'Kurze Rast', total: '✓', detail: 'Kurzrast-Ressourcen zurück. Trefferwürfel kannst du einzeln ausgeben.' }); }
  commit();
}

function lvlUpOpen() {
  const ch = cur(); const c = derive(ch, S.hb); if (c.level >= 20) return;
  S.lu = S.lu || { cls: ch.cls, roll: null };
  const opts = [[ch.cls, CLASSES[ch.cls].name + ' ' + (c.lv(ch.cls)) + ' → ' + (c.lv(ch.cls) + 1)]].concat((ch.multi || []).map((m) => [m.cls, CLASSES[m.cls].name + ' ' + m.level + ' → ' + (+m.level + 1)]));
  const id = S.lu.cls; const C = CLASSES[id]; const nl = c.lv(id) + 1; const e = c.classes.find((x) => x.id === id);
  const gain = C.feats.filter((f) => f[0] === nl).map((f) => [f[1], f[2]]);
  if (nl >= 3 && e) e.subFeats.filter((f) => f[0] === nl).forEach((f) => gain.push([f[1] + ' (' + e.subName + ')', f[2]]));
  if ((C.asi || []).includes(nl) && !gain.some((g) => /Attributswert/.test(g[0]))) gain.push(['Attributswerterhöhung oder Talent', 'Erhöhe ein Attribut um 2 oder zwei um 1 – oder wähle ein Talent. Du wählst es nach dem Aufstieg im Erschaffen-Bereich.']);

  if (nl === 3 && C.subs && !e.subChosen) gain.push(['Unterklasse', 'Du wählst nach dem Aufstieg deine Unterklasse.']);
  const avg = C.hd / 2 + 1; const con = c.mod.con;
  const hpTxt = ch.hpMode === 'roll' ? (S.lu.roll ? 'Gewürfelt: ' + S.lu.roll + ' ' + sgn(con) + ' = <b>' + Math.max(1, S.lu.roll + con) + ' TP</b>' : '<button class="btn sm" data-act="luRoll">W' + C.hd + ' würfeln</button>') : 'Durchschnitt ' + avg + ' ' + sgn(con) + ' = <b>' + Math.max(1, avg + con) + ' TP</b>';

    (pbNew > c.pb ? '<div class="lurow"><span>Übungsbonus</span><div>' + sgn(c.pb) + ' → <b>' + sgn(pbNew) + '</b></div></div>' : '') +
    '<div class="lurow"><span>Neu</span><div>' + (gain.length ? gain.map(([n, t]) => '<details><summary><b>' + esc(n) + '</b></summary><p>' + esc(t) + '</p></details>').join('') : 'Keine neuen Merkmale auf dieser Stufe – aber mehr TP und ggf. mehr Ressourcen.') + '</div></div>' +

    '<div class="chips"><button class="btn ghost" data-act="closeModal">Abbrechen</button><button class="btn big" data-act="luGo"' + (ch.hpMode === 'roll' && !S.lu.roll ? ' disabled' : '') + '>Aufsteigen</button></div></div>';
  m.hidden = false;

function lvlUpGo() {
  const ch = cur(); const before = derive(ch, S.hb); const id = S.lu.cls; const nl = before.lv(id) + 1;
  if (id === ch.cls) { ch.level = nl; if (ch.hpMode === 'roll') ch.hpRolls[nl] = S.lu.roll; }
  else { const mm = ch.multi.find((x) => x.cls === id); if (!mm) return; mm.level = nl; if (ch.hpMode === 'roll') { mm.hpRolls = mm.hpRolls || {}; mm.hpRolls[nl] = S.lu.roll; } }
  const after = derive(ch, S.hb); const P = ch.play; P.hp = Math.min(after.hpMax, (P.hp ?? before.hpMax) + (after.hpMax - before.hpMax));

  if (key === 'runes') return /Aktivierung/.test(text) ? 1 : 0;

}
function optDice(key, text, c, lvl) {
  const die = RW_DIE(lvl); const out = []; const abK = { INT: 'int', KON: 'con', CHA: 'cha' };

  while ((m = re.exec(t))) {
    if (t[m.index - 1] === '+' || /^\s*pro zusätzlich/.test(t.slice(m.index + m[0].length))) continue;
    if (/^\s*(?:von|abzieh)/.test(t.slice(m.index + m[0].length)) ) { out.push({ expr: (m[1] ? m[1] + die : m[3]), what: 'Abzug' }); continue; }
    out.push({ expr: m[1] ? m[1] + die + modOf(m[2]) : m[3] + modOf(m[4]), what: kind(m.index) });

function d20(mod, label, opts = {}) {

    if (c.cls.order) body += '<h3 id="a-order">' + c.cls.order.label + '</h3><div class="opts">' + Object.entries(c.cls.order.opts).map(([k, [n, t]]) => '<button class="opt' + (ch.order === k ? ' on' : '') + '" data-act="pick" data-path="order" data-val="' + k + '"><b>' + n + '</b><span>' + t + '</span></button>').join('') + '</div>';

    body += '<h3>' + c.cls.name + ' bis Stufe ' + ch.level + '</h3><div class="tbl"><table><tbody>' + c.cls.table(ch.level).map(([a, b]) => '<tr><th>' + a + '</th><td>' + b + '</td></tr>').join('') + (c.hasSub ? '<tr><th>Unterklasse</th><td>' + c.subName + '</td></tr>' : '<tr><th>Unterklasse</th><td>ab Stufe 3' + (c.cls.subs ? ' (3 zur Wahl)' : ': ' + c.cls.sub.name) + '</td></tr>') + '</tbody></table></div>';
    if (c.cls.subs && ch.level >= 3) body += '<h3 id="a-sub">Unterklasse</h3><div class="opts">' + c.cls.subs.map((sb) => '<button class="opt' + ((ch.sub || (c.cls.subDefault ? c.cls.subs[0].id : '')) === sb.id ? ' on' : '') + '" data-act="pick" data-path="sub" data-val="' + sb.id + '"><b>' + sb.name + '</b><span>' + esc(sb.feats[0][1] + ': ' + sb.feats[0][2]) + '</span></button>').join('') + '</div>';
    body += featList(c.features.filter((f) => f.src === c.cls.name || f.src === c.subName));
    body += mcSection(c);
  }
  if (st === 1) {
    body += '<h2>Spezies</h2><div class="cards">' + Object.entries(SPECIES).map(([k, s]) => '<button class="card' + (ch.species === k ? ' on' : '') + '" data-act="setSpecies" data-arg="' + k + '"><b>' + s.name + '</b><small>' + s.size + ' · ' + fmtM(s.speed) + (s.dv ? ' · Dunkelsicht' : '') + '</small></button>').join('') + '</div>';
    const sp = c.sp;
    if (sp.choice) body += '<h3>' + sp.choice.label + '</h3><div class="chips">' + Object.entries(sp.choice.opts).map(([k, l]) => chip(ch.speciesChoice === k, l, 'data-act="pick" data-path="speciesChoice" data-val="' + k + '"')).join('') + '</div>';
    if (sp.skillPick) body += '<h3 id="a-spskill">Fertigkeit (' + sp.name + ')</h3><div class="chips">' + sp.skillPick.map((s) => chip(ch.speciesSkill === s, SKILLS[s][0], 'data-act="pick" data-path="speciesSkill" data-val="' + s + '"')).join('') + '</div>';
    if (sp.spellAbility) body += '<div class="row">' + field('Zauberattribut für Spezies-Zauber', sel('speciesSpellAbility', ch.speciesSpellAbility, abOpts(['int', 'wis', 'cha']))) + '</div>';
    if (sp.bonusFeat) body += '<div class="row">' + field('Herkunftstalent (Vielseitig)', sel('humanFeat', ch.humanFeat, featOptions('origin', hb))) + '</div>' + (featById(ch.humanFeat, hb) ? '<p class="hint">' + esc(featById(ch.humanFeat, hb).text) + '</p>' : '') + miPicker(c, 'human');
    body += featList(c.features.filter((f) => f.src === sp.name));
    body += '<h2>Hintergrund</h2><div class="cards">' + Object.entries(BACKGROUNDS).map(([k, b]) => '<button class="card' + (ch.bg === k ? ' on' : '') + '" data-act="setBg" data-arg="' + k + '"><b>' + b.name + '</b><small>' + (b.abil ? b.abil.map((a) => AB_K[a]).join(', ') + ' · ' + FEATS[b.feat].name : 'Selbst zusammenstellen') + '</small></button>').join('') + '</div>';
    if (ch.bg === 'custom') {
      const bc = ch.bgCustom;
      body += '<div class="box"><div class="row">' + field('Name', txt('bgCustom.name', bc.name, 'z. B. Schmied')) + field('Herkunftstalent', sel('bgCustom.feat', bc.feat, featOptions('origin', hb))) + '</div>' +
        '<h4>Drei Attribute</h4><div class="chips">' + AB.map((a) => chip(bc.abil.includes(a), AB_DE[a], 'data-act="toggle" data-path="bgCustom.abil" data-val="' + a + '" data-max="3"', bc.abil.length >= 3)).join('') + '</div>' +
        '<h4>Zwei Fertigkeiten</h4><div class="chips">' + ALL_SKILLS.map((s) => chip(bc.skills.includes(s), SKILLS[s][0], 'data-act="toggle" data-path="bgCustom.skills" data-val="' + s + '" data-max="2"', bc.skills.length >= 2)).join('') + '</div></div>';
    }
    const bg = c.bg;
    body += '<h3 id="a-bgplus">Attributsboni aus „' + esc(bg.name) + '“</h3><div class="chips">' + chip(ch.bgMode === '21', '+2 und +1', 'data-act="bgMode" data-arg="21"') + chip(ch.bgMode === '111', '+1 / +1 / +1', 'data-act="bgMode" data-arg="111"') + '</div>';
    body += '<div class="bgplus">' + (bg.abil || []).map((a) => '<div class="bp"><span>' + AB_DE[a] + '</span><div class="chips">' + (ch.bgMode === '21' ? [0, 1, 2] : [0, 1]).map((v) => chip((+ch.bgPlus[a] || 0) === v, v ? '+' + v : '0', 'data-act="bgPlus" data-path="' + a + '" data-val="' + v + '"')).join('') + '</div></div>').join('') + '</div>';
    if (ch.bg !== 'custom' && featById(bg.feat, hb)) body += '<div class="row">' + field('Herkunftstalent', sel('bgFeat', ch.bgFeat || bg.feat, featOptions('origin', hb))) + '</div><p class="hint">' + esc(featById(ch.bgFeat || bg.feat, hb).text) + ' <em>(Laut Regeln gehört „' + esc(FEATS[BACKGROUNDS[ch.bg].feat].name) + '“ zu ' + esc(bg.name) + ' – ein anderes Talent zu wählen ist eine Hausregel.)</em></p>';
    body += '<p class="hint">Fertigkeiten: ' + (bg.skills || []).map((s) => SKILLS[s][0]).join(', ') + (bg.tool ? ' · Werkzeug: ' + bg.tool : '') + (bg.equip ? '<br>Ausrüstung: ' + bg.equip : '') + '</p>';
    body += miPicker(c, 'bg');
  }
  if (st === 2) {
    body += '<h2>Attributswerte</h2><div class="chips">' + [['standard', 'Standardwerte'], ['pointbuy', 'Punktekauf (27)'], ['manual', 'Gewürfelt / frei']].map(([k, l]) => chip(ch.method === k, l, 'data-act="method" data-arg="' + k + '"')).join('') + '</div>';
    if (ch.method === 'pointbuy') body += '<p class="hint">Punkte: <b>' + (c.pointsUsed ?? 0) + '</b> / 27 · Werte 8–15, 14 kostet 7, 15 kostet 9.</p>';
    if (ch.method === 'standard') body += '<p class="hint">Verteile 15, 14, 13, 12, 10 und 8. Für ' + c.cls.name + ' zuerst ' + c.cls.prim.map((a) => AB_DE[a]).join(' und ') + '.</p>';
    body += '<div class="abgrid" id="a-abil">' + AB.map((a) => {
      let inp;
      if (ch.method === 'standard') inp = sel('base.' + a, ch.base[a], [15, 14, 13, 12, 10, 8].map((v) => [v, v]), 'data-type="num"');
      else if (ch.method === 'pointbuy') inp = '<div class="stepper"><button data-act="pb" data-path="' + a + '" data-arg="-1" aria-label="weniger">−</button><b>' + ch.base[a] + '</b><button data-act="pb" data-path="' + a + '" data-arg="1" aria-label="mehr">+</button></div>';
      else inp = num('base.' + a, ch.base[a], 'min="1" max="20"');
      return '<div class="abbox' + (c.cls.prim.includes(a) ? ' prim' : '') + '"><span class="abn">' + AB_DE[a] + '</span>' + inp + '<div class="abres"><b>' + c.abil[a] + '</b><span>' + sgn(c.mod[a]) + '</span></div><small>' + c.breakdown[a].slice(1).join(' · ') + '</small></div>';
    }).join('') + '</div>';
    const lvls = c.asiSlots;
    if (lvls.length) {
      body += '<h3>Attributswerterhöhungen & Talente</h3>';
      body += lvls.map((slot) => { const lv = slot.key;
        const a = ch.asi[lv] || {}; const fid = a.feat || (slot.al === 19 ? '' : 'asi'); const f = featById(fid, hb);
        let pl = '';
        if (f && f.asi) pl = '<div class="asiplus">' + AB.map((k) => '<div class="bp"><span>' + AB_K[k] + '</span><div class="chips">' + [0, 1, 2].map((v) => chip((+(a.plus || {})[k] || 0) === v, v ? '+' + v : '0', 'data-act="asiPlus" data-arg="' + lv + '" data-path="' + k + '" data-val="' + v + '"')).join('') + '</div></div>').join('') + '</div>';
        else if (f && f.plus) pl = '<div class="chips">' + f.plus.map((k) => chip((a.plus || {})[k], AB_DE[k] + ' +1', 'data-act="asiOne" data-arg="' + lv + '" data-path="' + k + '"')).join('') + '</div>';
        if (f && f.saveChoice) pl += '<h4>Rettungswurf mit Übung</h4><div class="chips">' + f.saveChoice.map((k) => chip(a.save === k, AB_DE[k], 'data-act="asiSave" data-arg="' + lv + '" data-path="' + k + '"', c.cls.saves.includes(k))).join('') + '</div>';
        return '<div class="box" id="a-asi-' + lv + '"><div class="row">' + field(slot.label + (slot.al === 19 ? ' (Epische Gabe)' : ''), sel('asi.' + lv + '.feat', fid, (slot.al === 19 ? [['', '— wählen —']] : []).concat(featOptions('asi', hb, { fightingStyle: c.styleN }, slot.al)))) + '</div>' + (f ? '<p class="hint">' + esc(f.text) + '</p>' : '') + pl + (f && f.mi ? miPicker(c, 'asi' + lv) : '') + '</div>';
      }).join('');
    }
  }
  if (st === 3) {
    const C = c.cls;
    body += '<h2 id="a-skills">Fertigkeiten</h2><p class="hint">' + C.name + ': wähle ' + C.skillN + '. Vom Hintergrund: ' + (c.bg.skills || []).map((s) => SKILLS[s][0]).join(', ') + '.</p><div class="chips">' +
      C.skills.map((s) => { const fromBg = (c.bg.skills || []).includes(s); return chip(ch.classSkills.includes(s), SKILLS[s][0] + (fromBg ? ' (Hintergrund)' : ''), 'data-act="toggle" data-path="classSkills" data-val="' + s + '" data-max="' + C.skillN + '"', ch.classSkills.length >= C.skillN || fromBg); }).join('') + '</div>';
    if (c.extraN) body += '<h3 id="a-extra">Zusätzliche Fertigkeiten (' + c.extraN + ')</h3><p class="hint">' + c.extraSrc.join(', ') + '</p><div class="chips">' + ALL_SKILLS.map((s) => chip(ch.extraSkills.includes(s), SKILLS[s][0], 'data-act="toggle" data-path="extraSkills" data-val="' + s + '" data-max="' + c.extraN + '"', ch.extraSkills.length >= c.extraN)).join('') + '</div>';
    if (c.expN) body += '<h3 id="a-exp">Expertise (' + c.expN + ')</h3><div class="chips">' + ALL_SKILLS.filter((s) => c.skills[s].prof && (!c.expFrom || c.expFrom.includes(s))).map((s) => chip(ch.expertise.includes(s), SKILLS[s][0], 'data-act="toggle" data-path="expertise" data-val="' + s + '" data-max="' + c.expN + '"', ch.expertise.filter((x) => c.skills[x].prof).length >= c.expN)).join('') + '</div>';
    body += '<div class="skillgrid">' + ALL_SKILLS.map((s) => '<div class="sk' + (c.skills[s].prof ? ' p' + c.skills[s].prof : '') + '"><span>' + SKILLS[s][0] + ' <small>' + AB_K[SKILLS[s][1]] + '</small></span><b>' + sgn(c.skills[s].val) + '</b></div>').join('') + '</div>';
    const styleN = c.styleN;
    if (styleN) {
      body += '<h3 id="a-style">Kampfstil (' + styleN + ')</h3><div class="opts">' + featOptions('style', S.hb).map(([id, n]) => { const f = featById(id, S.hb); return '<button class="opt' + (ch.styles.includes(id) ? ' on' : '') + '" data-act="toggle" data-path="styles" data-val="' + id + '" data-max="' + styleN + '"><b>' + esc(n.replace('Kampfstil: ', '')) + '</b><span>' + esc(f.text) + '</span></button>'; }).join('') + '</div>';
    }
    if (c.lv('wlk')) {
      body += '<h3 id="a-inv">Schauerliche Anrufungen (' + c.invN + ')</h3><div class="opts">' + Object.entries(INVOCATIONS).map(([k, [n, t, lv]]) => (c.lv('wlk') >= lv || ch.invocations.includes(k)) ? '<button class="opt' + (ch.invocations.includes(k) ? ' on' : '') + '" data-act="toggle" data-path="invocations" data-val="' + k + '" data-max="' + c.invN + '"><b>' + n + '</b><span>' + t + '</span></button>' : '').join('') + '</div>';
    }
    (c.optSets || []).forEach((o) => { body += '<h3 id="a-opt-' + o.key + '">' + o.label + ' <span class="cnt">' + o.chosen.length + ' / ' + o.n + '</span></h3><div class="opts">' + o.items.map((it) => { const on = o.chosen.includes(it.k); const locked = it.min > o.lvl; return '<button class="opt' + (on ? ' on' : '') + '"' + (locked && !on ? ' disabled' : '') + ' data-act="toggle" data-path="' + o.path + '" data-val="' + it.k + '" data-max="' + o.n + '"><b>' + esc(it.name) + (it.min > 1 ? ' <small>ab Stufe ' + it.min + '</small>' : '') + '</b><span>' + esc(it.text) + '</span></button>'; }).join('') + '</div>'; });
    body += '<h3>Talente</h3>' + featList(c.features.filter((f) => f.feat));
  }
  if (st === 4) {
    const sc = c.spell;
    if (!sc.has && !c.extraSpells.length) body += '<h2>Zauber</h2><p class="empty">' + c.classLabel + ' wirkt keine Zauber' + (ch.cls === 'fig' || ch.cls === 'rog' ? '' : '') + '. Zauber aus Spezies oder Talenten erscheinen hier automatisch.</p>';
    if (sc.has) {
      body += '<h2>Zauber</h2><p class="hint">' + (sc.slots.length ? 'Zauberplätze: ' + sc.slots.map((n, i) => 'Grad ' + (i + 1) + ': ' + n).join(' · ') : '') + (sc.slots.length && sc.pact ? ' · ' : '') + (sc.pact ? 'Paktplätze: ' + sc.pact.n + '× Grad ' + sc.pact.lvl : '') + (sc.classes.length > 1 ? '<br>Mit Multiclassing werden die Zauberplätze gemeinsam berechnet; vorbereiten kannst du pro Klasse nur Zauber bis zu dem Grad, den die Klasse allein erreichen würde.' : '') + '</p>';
      sc.classes.forEach((info, ix) => {
        const chosenC = getP(ch, info.path + 'cantrips') || []; const chosenP = getP(ch, info.path + 'spells') || [];
        body += (sc.classes.length > 1 ? '<h3 class="clsh">' + info.name + '</h3>' : '') + '<div class="stats3"><div><span>Zauber-SG</span><b>' + info.dc + '</b></div><div><span>Zauberangriff</span><b>' + sgn(info.atk) + '</b></div><div><span>Attribut</span><b>' + AB_K[info.ability] + '</b></div><div><span>Bis Grad</span><b>' + info.maxLvl + '</b></div></div>';
        if (info.always.length) body += '<h4>Immer vorbereitet</h4><div class="chips">' + info.always.map((id) => '<span class="tag">' + esc(spellName(id)) + '</span>').join('') + '</div>';
        if (info.cantripN) body += '<h3' + (ix === 0 ? ' id="a-cantrips"' : '') + '>Zaubertricks <span class="cnt">' + info.cantrips.length + ' / ' + info.cantripN + '</span></h3>' + spellPicker(info.list.filter((x) => x.lvl === 0), chosenC, info.path + 'cantrips', info.cantripN, info.always);
        body += '<h3' + (ix === 0 ? ' id="a-prep"' : '') + '>Vorbereitete Zauber <span class="cnt">' + info.prepared.length + ' / ' + info.prepN + '</span></h3>';
        body += spellPicker(info.list.filter((x) => x.lvl > 0 && x.lvl <= info.maxLvl), chosenP, info.path + 'spells', info.prepN, info.always);
        if (info.arcanum && info.arcanum.length) { const arc = getP(ch, info.path + 'arcanum') || {}; body += '<h3>Mystisches Arkanum</h3><div class="row">' + info.arcanum.map((g) => field('Grad ' + g, sel(info.path + 'arcanum.' + g, arc[g] || '', [['', '— wählen —']].concat(info.list.filter((x) => x.lvl === g).map((x) => [x.id, x.name]))))).join('') + '</div>'; }
      });
    }
    if (c.extraSpells.length) body += '<h3>Weitere Zauber</h3><ul class="plain">' + c.extraSpells.map((e) => '<li><b>' + esc(spellName(e.id)) + '</b> · ' + esc(e.src) + ' · SG ' + e.dc + ', Angriff ' + sgn(e.atk) + ' (' + AB_K[e.ab] + ')</li>').join('') + '</ul>';
  }
  if (st === 5) {
    const armorOpts = Object.entries(ARMOR).map(([k, a]) => [k, a.name + (a.ac ? ' (RK ' + a.ac + (a.type === 'light' ? ' + GES' : a.type === 'medium' ? ' + GES max 2' : '') + ')' : '')]);
    body += '<h2 id="a-armor">Rüstung</h2><div class="row">' + field('Rüstung', sel('armor', ch.armor, armorOpts)) + field('Magiebonus Rüstung', num('armorBonus', ch.armorBonus, 'min="0" max="3"')) + '</div>';
    body += '<div class="chips">' + chip(ch.shield, 'Schild (+2)', 'data-act="flip" data-path="shield"') + (ch.shield ? '' : '') + chip(ch.mageArmor, 'Magierrüstung aktiv', 'data-act="flip" data-path="mageArmor"') + '</div>' + (ch.shield ? '<div class="row">' + field('Magiebonus Schild', num('shieldBonus', ch.shieldBonus, 'min="0" max="3"')) + '</div>' : '');
    body += '<p class="calc">RK <b>' + c.ac + '</b> = ' + c.acParts.join(' + ') + '</p>';
    body += '<h2 id="a-weapons">Waffen</h2><div class="row">' + field('Waffe hinzufügen', '<select id="addW"><option value="">— Waffe wählen —</option><optgroup label="Einfache Waffen">' + Object.entries(WEAPONS).filter(([, w]) => w[1] === 's').map(([k, w]) => '<option value="' + k + '">' + w[0] + ' (' + w[3] + ')</option>').join('') + '</optgroup><optgroup label="Kriegswaffen">' + Object.entries(WEAPONS).filter(([, w]) => w[1] === 'm').map(([k, w]) => '<option value="' + k + '">' + w[0] + ' (' + w[3] + ')</option>').join('') + '</optgroup></select>') + '</div>';
    if (c.masteryN) body += '<p class="hint">Waffenmeisterschaften: ' + ch.weapons.filter((w) => w.mastery).length + ' / ' + c.masteryN + '</p>';
    body += '<div class="wlist">' + ch.weapons.map((w, i) => { const W = WEAPONS[w.w]; if (!W) return ''; const a = c.attacks.find((x) => x.idx === i);
      return '<div class="wrow"><div class="wn"><b>' + W[0] + '</b><small>' + a.props + '</small></div><div class="wv">' + sgn(a.atk) + ' · ' + a.dmg + (a.dmg2 ? ' / ' + a.dmg2 : '') + ' ' + a.dtype + '</div>' +
        field('Bonus', num('weapons.' + i + '.bonus', w.bonus || 0, 'min="0" max="3"')) + field('Attribut', sel('weapons.' + i + '.ab', w.ab || 'auto', [['auto', 'Automatisch'], ['str', 'STÄ'], ['dex', 'GES'], ['cha', 'CHA'], ['wis', 'WEI'], ['int', 'INT']])) +
        (c.masteryN ? chip(w.mastery, 'Meisterschaft: ' + MASTERY[W[6]][0], 'data-act="flip" data-path="weapons.' + i + '.mastery" title="' + esc(MASTERY[W[6]][1]) + '"') : '') +
        '<button class="x" data-act="rmW" data-arg="' + i + '" aria-label="Entfernen">×</button></div>'; }).join('') + '</div>';
    body += '<h2>Hausregeln & Gegenstände</h2>';
    const hbs = Object.values(S.hb).filter((h) => h.kind !== 'spell');
    body += hbs.length ? '<div class="opts">' + hbs.map((h) => '<button class="opt' + (ch.homebrew.includes(h.id) ? ' on' : '') + '" data-act="toggle" data-path="homebrew" data-val="' + h.id + '"><b>' + esc(h.name) + '</b><span>' + esc({ feature: 'Merkmal', item: 'Gegenstand', feat: 'Talent' }[h.kind] || '') + bonusText(h) + '</span></button>').join('') + '</div>' : '<p class="empty">Noch keine Hausregeln. Lege unter „Hausregeln“ eigene Merkmale oder Gegenstände an (z. B. deine Äthermaschine) und hake sie hier an.</p>';
    body += '<h3>Sonstige Boni</h3><div class="row misc">' + [['ac', 'RK'], ['save', 'Rettungswürfe'], ['dc', 'Zauber-SG'], ['atk', 'Angriff'], ['init', 'Initiative'], ['hp', 'TP-Maximum'], ['speed', 'Bewegung (m)']].map(([k, l]) => field(l, num('misc.' + k, ch.misc[k] || 0))).join('') + '</div>';
    body += gearBlock(c, true);
  }
  if (st === 6) {
    body += '<h2>Abschluss</h2><p class="hint">Gib deinem Helden einen Namen und eine Geschichte. Danach kannst du ihn sichern und losspielen.</p><div class="row">' + field('Name', txt('name', ch.name)) + field('Spieler', txt('player', ch.player)) + '</div><div class="row">' + field('Gesinnung', txt('alignment', ch.alignment, 'z. B. Neutral gut')) + field('Sprachen', txt('languages', ch.languages)) + '</div>' +
      field('Aussehen & Persönlichkeit', area('appearance', ch.appearance, 'Aussehen, Ideale, Bindungen, Makel …')) + field('Notizen', area('notes', ch.notes, 'Hintergrundgeschichte, Kampagnennotizen …', 6));
    body += '<div class="finish"><h3>' + (c.warn.length ? 'Fast geschafft' : 'Dein Held ist bereit') + '</h3><p class="hint" style="margin:0">' + (c.warn.length ? 'Es sind noch ' + c.warn.length + ' Auswahl(en) offen (rechts antippen). Du kannst trotzdem schon sichern.' : 'Sichere ihn als Datei, damit du ihn jederzeit wieder laden oder weitergeben kannst.') + '</p><div class="chips"><button class="btn big" data-act="exportOne" data-arg="' + ch.id + '">Helden exportieren</button><button class="btn big ghost" data-act="view" data-arg="sheet">Zum Charakterbogen</button></div></div>';
  }
  const nav = '<div class="stepnav">' + (st > 0 ? '<button class="btn ghost" data-act="step" data-arg="' + (st - 1) + '">← ' + STEPS[st - 1] + '</button>' : '<span></span>') + (st < STEPS.length - 1 ? '<button class="btn" data-act="step" data-arg="' + (st + 1) + '">' + STEPS[st + 1] + ' →</button>' : '<button class="btn" data-act="view" data-arg="sheet">Losspielen →</button>') + '</div>';
  return '<div class="build"><ol class="steps">' + STEPS.map((s, i) => '<li><button class="' + (i === st ? 'on' : '') + '" data-act="step" data-arg="' + i + '"><span>' + (i + 1) + '</span>' + s + '</button></li>').join('') + '</ol><section class="panel">' + body + nav + '</section>' + summary(c) + '</div>';
}

    saMiss: () => saNext(),
    fx: () => { ch.play.fx = ch.play.fx || {}; ch.play.fx[arg] = !ch.play.fx[arg]; commit(); },
    rage: () => { const P = ch.play; if (P.raging) { P.raging = false; return commit(); } const c = derive(ch, S.hb); const r = c.res.find((x) => x.k === 'rage'); if (r && (+P.res.rage || 0) >= r.max) { pushLog({ label: 'Kampfrausch', total: '✗', detail: 'Keine Nutzung mehr übrig' }); return; } P.res.rage = (+P.res.rage || 0) + 1; P.raging = true; let n = 'Resistenz gegen Wucht-, Stich- und Hiebschaden · +' + c.rageDmg + ' Schaden mit Stärke · Vorteil auf STÄ-Würfe'; if (P.conc) { n += ' · Konzentration auf ' + P.conc.name + ' endet'; endConc(P); } pushLog({ label: 'Kampfrausch!', total: '⚔', detail: n, share: true }); commit(); },
    orbHit: () => orbHit(),

    hbEdit: () => { S.hbEdit = JSON.parse(JSON.stringify(S.hb[arg])); S.confirm = null; render(); },
    hbCancel: () => { S.hbEdit = null; render(); },

    hbAskDel: () => { S.confirm = 'hb'; render(); },

function onBind(ev) {
  const t = ev.target; if (!t.dataset || !t.dataset.bind) return;

  const p = t.dataset.bind;
  if (p.startsWith('hbe.')) { S.hbEdit[p.slice(4)] = v; if (ev.type === 'change' && t.tagName === 'SELECT') render(); return; }
  const ch = cur(); setP(ch, p, v);
  const fm = /^asi\.(\d+)\.feat$/.exec(p); if (fm) { ch.asi[fm[1]].plus = {}; delete ch.asi[fm[1]].save; }
  if (p === 'play.exh') { v = +v; if (v >= 6 && !ch.play.dead) { pushLog({ label: 'Erschöpfung Stufe 6', total: '†', detail: 'Auf der sechsten Erschöpfungsstufe stirbt ein Held.' }); fall(ch.play); } }
  const norender = t.hasAttribute('data-norender') || (ev.type === 'input');
  commit(!norender);
}
document.addEventListener('input', (ev) => { const t = ev.target; if (t.dataset && t.dataset.bind && (t.tagName === 'TEXTAREA' || t.type === 'text')) onBind(ev); if (t.id === 'sq') { S.sf.q = t.value; const pos = t.selectionStart; render(); const n = $('#sq'); n.focus(); n.setSelectionRange(pos, pos); } });
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (xChange(t)) return;
  if (t.id === 'addMc' && t.value) { const ch = cur(); ch.multi = ch.multi || []; const total = ch.level + ch.multi.reduce((a, m) => a + (+m.level || 0), 0); if (total < 20) ch.multi.push({ cls: t.value, level: 1, order: '', land: 'temperate', cantrips: [], spells: [], arcanum: {} }); commit(); return; }
  if (t.id === 'addW' && t.value) { cur().weapons.push({ w: t.value, bonus: 0, mastery: false, ab: 'auto' }); commit(); return; }
  if (t.id === 'sl') { S.sf.lvl = t.value; render(); return; }
  if (t.id === 'sc') { S.sf.cls = t.value; render(); return; }
  if (t.id === 'importFile' && t.files[0]) { const r = new FileReader(); r.onload = () => { try { importJson(r.result); } catch (e) { pushLog({ label: 'Datei laden', total: '✗', detail: 'Die Datei ist keine Heldenbuch-Datei.' }); } }; r.readAsText(t.files[0]); t.value = ''; return; }
  if (t.dataset && t.dataset.bind && !(t.tagName === 'TEXTAREA' || t.type === 'text')) onBind(ev);
  else if (t.dataset && t.dataset.bind && t.type === 'text' && !t.dataset.bind.startsWith('hbe.')) { commit(true); }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'campCode') { e.preventDefault(); const v = e.target.value.trim(); if (v) joinCamp(v); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').hidden) { $('#modal').hidden = true; S.modal = null; } });
document.addEventListener('click', (e) => { if (e.target.id === 'modal') { e.target.hidden = true; S.modal = null; } });
function embers() {
  const cv = $('#embers'); if (!cv || !cv.getContext) return;
  let reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (reduce) return;
  const ctx = cv.getContext('2d'); let W, H, dpr; const P = [];
  const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); window.addEventListener('resize', size);
  const N = Math.round(Math.min(46, (W * H) / 32000));
  const spawn = (p, init) => { p.x = Math.random() * W; p.y = init ? Math.random() * H : H + 10; p.r = 0.6 + Math.random() * 1.8; p.vy = 0.15 + Math.random() * 0.45; p.vx = (Math.random() - 0.5) * 0.2; p.a = 0.15 + Math.random() * 0.5; p.t = Math.random() * 6.28; return p; };
  for (let i = 0; i < N; i++) P.push(spawn({}, true));
  const tick = () => {
    if (!document.hidden) {
      ctx.clearRect(0, 0, W, H);
      for (const p of P) { p.t += 0.02; p.y -= p.vy; p.x += p.vx + Math.sin(p.t) * 0.15; if (p.y < -10) spawn(p);
        const fl = p.a * (0.7 + 0.3 * Math.sin(p.t * 3)); const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        g.addColorStop(0, 'rgba(255,214,140,' + fl + ')'); g.addColorStop(0.4, 'rgba(226,130,60,' + fl * 0.5 + ')'); g.addColorStop(1, 'rgba(226,118,58,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.283); ctx.fill(); }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

(function boot() {
  const l = lsGet();
  if (l && l.chars) { S.chars = l.chars; S.hb = l.hb || {}; S.cur = l.cur; Object.values(S.chars).forEach(normChar); }
  if (!S.chars[S.cur]) S.cur = Object.keys(S.chars)[0] || null;
  try { const cp = JSON.parse(localStorage.getItem('heldenbuch_camp') || 'null'); if (cp) { S.camp = cp.code || ''; S.share = cp.share !== false; S.secret = !!cp.secret; } } catch (e) {}
  render();
  embers();
  connectDb();
})();
